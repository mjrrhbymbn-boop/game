<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Quest - رحلة فرز الألوان</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --text-color: #f0f6fc;
            --sub-text: #8b949e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* الهيدر وشريط الأدوات */
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title-area h1 {
            margin: 0;
            font-size: 22px;
            color: #a5d6ff;
        }

        .title-area span {
            font-size: 12px;
            color: var(--sub-text);
        }

        /* بطاقة الإحصائيات */
        .stats-card {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #38d9a9;
        }

        .stat-label {
            font-size: 12px;
            color: var(--sub-text);
            margin-top: 4px;
        }

        /* الأنابيب والكرات */
        .game-board {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 420px;
            margin-bottom: 30px;
        }

        .tube {
            width: 60px;
            height: 200px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            border-radius: 0 0 30px 30px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding-bottom: 8px;
            cursor: pointer;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .tube.selected {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.5);
            transform: translateY(-10px);
        }

        /* تأثيرات التلميح الذكي */
        .tube.hint-from {
            border-color: #ff4757 !important;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.8) !important;
            transform: scale(1.05);
        }

        .tube.hint-to {
            border-color: #2ed573 !important;
            box-shadow: 0 0 20px rgba(46, 213, 115, 0.8) !important;
            transform: scale(1.05);
        }

        .ball {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            margin-top: 4px;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.4), 0 3px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        /* أزرار التحكم والمساعدات */
        .controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: #21262d;
            color: var(--text-color);
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #30363d;
            transform: translateY(-2px);
        }

        .btn-hint {
            background: #1f6beb;
            border-color: #388bfd;
        }

        .btn-hint:hover {
            background: #388bfd;
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="title-area">
            <h1>Color Quest</h1>
            <span>رحلة فرز الألوان</span>
        </div>
    </div>

    <!-- لوحة الإحصائيات -->
    <div class="stats-card">
        <div class="stat-item">
            <span class="stat-value" id="moves-count">0</span>
            <span class="stat-label">الحركات</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="timer-display">01:00</span>
            <span class="stat-label">الوقت المتبقي</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="score-display">140</span>
            <span class="stat-label">الرصيد</span>
        </div>
    </div>

    <!-- منطقة اللعب -->
    <div class="game-board" id="board"></div>

    <!-- التحكم والمساعدات -->
    <div class="controls">
        <button class="btn btn-hint" onclick="getSmartHint()">💡 تلميح ذكي</button>
        <button class="btn" onclick="restartGame()">🔄 إعادة</button>
    </div>

    <script>
        // إعدادات الألوان (يمكنك تعديل الألوان هنا)
        const COLORS = {
            red: '#ff4757',
            yellow: '#ffa502',
            blue: '#1e90ff',
            green: '#2ed573'
        };

        // الحالة الأوليّة للأنبوب (توزيع مبدئي)
        let initialTubes = [
            [COLORS.yellow, COLORS.blue, COLORS.yellow, COLORS.red],
            [COLORS.blue, COLORS.green, COLORS.green, COLORS.yellow],
            [COLORS.red, COLORS.red, COLORS.blue, COLORS.green],
            [], // أنبوب فارغ
            []  // أنبوب فارغ
        ];

        let tubes = JSON.parse(JSON.stringify(initialTubes));
        let selectedTubeIndex = null;
        let moves = 0;
        let timeLeft = 60;
        let timerInterval = null;

        // رسم الأنابيب والكرات على الشاشة
        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            tubes.forEach((tube, tubeIdx) => {
                const tubeEl = document.createElement('div');
                tubeEl.className = 'tube' + (selectedTubeIndex === tubeIdx ? ' selected' : '');
                tubeEl.onclick = () => handleTubeClick(tubeIdx);

                tube.forEach(color => {
                    const ballEl = document.createElement('div');
                    ballEl.className = 'ball';
                    ballEl.style.backgroundColor = color;
                    tubeEl.appendChild(ballEl);
                });

                board.appendChild(tubeEl);
            });

            document.getElementById('moves-count').innerText = moves;
        }

        // التفاعل عند النقر على الأنبوب
        function handleTubeClick(tubeIdx) {
            if (selectedTubeIndex === null) {
                if (tubes[tubeIdx].length > 0) {
                    selectedTubeIndex = tubeIdx;
                }
            } else {
                if (selectedTubeIndex === tubeIdx) {
                    selectedTubeIndex = null;
                } else {
                    if (isValidMove(selectedTubeIndex, tubeIdx)) {
                        moveBall(selectedTubeIndex, tubeIdx);
                        moves++;
                        selectedTubeIndex = null;
                        checkWin();
                    } else {
                        selectedTubeIndex = tubeIdx;
                    }
                }
            }
            renderBoard();
        }

        // التحقق من صحة الحركة
        function isValidMove(fromIdx, toIdx) {
            const fromTube = tubes[fromIdx];
            const toTube = tubes[toIdx];

            if (fromTube.length === 0) return false;
            if (toTube.length >= 4) return false;
            if (toTube.length === 0) return true;

            const topFromColor = fromTube[fromTube.length - 1];
            const topToColor = toTube[toTube.length - 1];

            return topFromColor === topToColor;
        }

        // تنفيذ نقل الكرة
        function moveBall(fromIdx, toIdx) {
            const ball = tubes[fromIdx].pop();
            tubes[toIdx].push(ball);
        }

        // ==========================================
        // خوارزمية التلميح الذكي الحقيقية
        // ==========================================
        function getSmartHint() {
            let possibleMoves = [];

            for (let fromIdx = 0; fromIdx < tubes.length; fromIdx++) {
                for (let toIdx = 0; toIdx < tubes.length; toIdx++) {
                    if (fromIdx === toIdx) continue;

                    if (isValidMove(fromIdx, toIdx)) {
                        let score = evaluateMove(fromIdx, toIdx);
                        possibleMoves.push({ from: fromIdx, to: toIdx, score: score });
                    }
                }
            }

            if (possibleMoves.length === 0) {
                alert("لا توجد حركات متمكّنة! حاول إعادة المرحلة.");
                return;
            }

            // ترتيب الحركات للحصول على أعلى فائدة
            possibleMoves.sort((a, b) => b.score - a.score);
            let bestMove = possibleMoves[0];

            highlightTubes(bestMove.from, bestMove.to);
        }

        function evaluateMove(fromIdx, toIdx) {
            let fromTube = tubes[fromIdx];
            let toTube = tubes[toIdx];
            let topBall = fromTube[fromTube.length - 1];
            let score = 0;

            // أولوية قصوى: النقل إلى أنبوب يحوي نفس اللون
            if (toTube.length > 0 && toTube[toTube.length - 1] === topBall) {
                score += 50;
                if (toTube.length + countTopSameColor(fromTube) === 4) {
                    score += 40;
                }
            }

            // حركة مفيدة: فتح المكان للكرات بالأسفل
            if (fromTube.length > 1 && fromTube[0] !== topBall) {
                score += 20;
            }

            // تجنب النقل لأنبوب فارغ بدون داعي
            if (toTube.length === 0) {
                if (isAllSameColor(fromTube)) {
                    score -= 30;
                } else {
                    score += 10;
                }
            }

            return score;
        }

        function countTopSameColor(tube) {
            if (tube.length === 0) return 0;
            let count = 0;
            let color = tube[tube.length - 1];
            for (let i = tube.length - 1; i >= 0; i--) {
                if (tube[i] === color) count++;
                else break;
            }
            return count;
        }

        function isAllSameColor(tube) {
            if (tube.length === 0) return false;
            return tube.every(ball => ball === tube[0]);
        }

        function highlightTubes(fromIdx, toIdx) {
            const tubeElements = document.querySelectorAll('.tube');
            if (!tubeElements[fromIdx] || !tubeElements[toIdx]) return;

            tubeElements[fromIdx].classList.add('hint-from');
            tubeElements[toIdx].classList.add('hint-to');

            setTimeout(() => {
                tubeElements[fromIdx].classList.remove('hint-from');
                tubeElements[toIdx].classList.remove('hint-to');
            }, 1500);
        }

        // ==========================================
        // نظام مؤقت الوقت
        // ==========================================
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 60;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                let formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                document.getElementById('timer-display').innerText = formattedTime;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("انتهى الوقت! ⏳ حاول مرة أخرى");
                    restartGame();
                }
            }, 1000);
        }

        // إعادة تشغيل اللعبة
        function restartGame() {
            tubes = JSON.parse(JSON.stringify(initialTubes));
            selectedTubeIndex = null;
            moves = 0;
            renderBoard();
            startTimer();
        }

        // التحقق من الفوز
        function checkWin() {
            let isWin = tubes.every(tube => {
                if (tube.length === 0) return true;
                if (tube.length === 4 && isAllSameColor(tube)) return true;
                return false;
            });

            if (isWin) {
                clearInterval(timerInterval);
                setTimeout(() => {
                    alert("مبارك! 🎉 أكملت المستوى بنجاح!");
                }, 300);
            }
        }

        // التجهيز عند فتح الصفحة
        window.onload = function() {
            renderBoard();
            startTimer();
        };
    </script>
</body>
</html>
