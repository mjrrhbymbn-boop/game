<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Color Quest - By Osama</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        
        body { 
            overflow: hidden; background: #0f0c29;
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            font-family: 'Cairo', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; color: white; touch-action: none; transition: background 0.5s;
        }

        /* خلفية النجوم */
        .stars { position: absolute; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.1; transform: scale(0.8); } 100% { opacity: 0.8; transform: scale(1.2); } }

        #game-container { position: relative; width: 100%; max-width: 450px; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px; }

        /* الشريط العلوي */
        .top-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px;
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 10;
        }
        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-title { font-size: 12px; color: #aaa; }
        .stat-value { font-size: 18px; font-weight: 700; color: #fff; }
        .level-title { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #e0e0e0; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* شبكة الأنابيب */
        #tubes-container {
            display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
            gap: 15px 20px; width: 100%; flex-grow: 1; margin-top: 20px;
        }

        .tube {
            width: 60px; height: 200px; position: relative;
            background: rgba(255,255,255,0.03); backdrop-filter: blur(5px);
            border: 2px solid rgba(255,255,255,0.2); border-top: none;
            border-radius: 0 0 30px 30px;
            display: flex; flex-direction: column-reverse; padding: 4px; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.4);
            cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
        }
        
        /* حافة الأنبوب */
        .tube::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; height: 8px;
            border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; z-index: 5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* تأثير اختيار الأنبوب */
        .tube.selected { transform: translateY(-25px); border-color: rgba(0, 255, 255, 0.8); box-shadow: inset 0 0 30px rgba(0, 255, 255, 0.3), 0 20px 30px rgba(0,0,0,0.6); }
        .tube.selected::before { border-color: rgba(0, 255, 255, 0.8); }

        /* السوائل */
        .liquid {
            width: 100%; height: 45px; border-radius: 8px; margin-top: 2px;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.4), inset 0 -5px 10px rgba(0,0,0,0.4);
            transition: all 0.3s ease; position: relative;
            animation: dropIn 0.3s ease-out;
        }
        @keyframes dropIn {
            0% { transform: scaleY(0); opacity: 0; transform-origin: bottom; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* أزرار التحكم تحت */
        .bottom-bar {
            display: flex; gap: 15px; margin-top: 20px; margin-bottom: 20px;
        }
        .btn {
            padding: 12px 25px; font-size: 16px; font-weight: bold; font-family: 'Cairo', sans-serif;
            background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }

        /* الشاشات المنبثقة */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.95); backdrop-filter: blur(10px);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20;
        }
        .overlay h1 { margin: 0 0 10px 0; font-size: 38px; font-weight: 900; color: #00ffff; text-shadow: 0 0 20px #00ffff; }
        .overlay p { margin: 0 0 30px 0; color: #ccc; font-size: 18px; text-align: center; }
        
        /* المتجر */
        #shop-screen { justify-content: flex-start; padding-top: 50px; overflow-y: auto; }
        .shop-item { 
            width: 80%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .shop-item h3 { font-size: 16px; margin: 0; }
        .shop-item p { font-size: 12px; color: #aaa; margin: 5px 0 0 0; }
        
        #credit { font-size: 12px; color: rgba(255,255,255,0.3); margin-bottom: 10px; }
        #credit strong { color: #00ffff; }

    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div id="game-container">
        <div class="top-bar">
            <div class="stat-box">
                <span class="stat-title">الحركات</span>
                <span class="stat-value" id="moves">0</span>
            </div>
            <div class="level-title">المستوى <span id="level">1</span></div>
            <div class="stat-box">
                <span class="stat-title">النجوم</span>
                <span class="stat-value" id="coins">0 ⭐</span>
            </div>
        </div>

        <div id="tubes-container"></div>

        <div class="bottom-bar">
            <button class="btn" onclick="undoMove()">↩️ تراجع</button>
            <button class="btn" onclick="openShop()">🛍️ المتجر</button>
        </div>

        <div id="credit">Programmed by <strong>Osama</strong></div>

        <!-- شاشة الفوز -->
        <div id="win-screen" class="overlay">
            <h1>أحسنت!</h1>
            <p>لقد رتبت الألوان بنجاح.</p>
            <button class="btn" style="background:#00ffff; color:#000; font-size: 20px;" onclick="nextLevel()">المستوى التالي</button>
        </div>

        <!-- المتجر -->
        <div id="shop-screen" class="overlay">
            <h1 style="color:#ffcc00; text-shadow: 0 0 20px #ffcc00;">المتجر</h1>
            <p>استخدم النجوم لتغيير مظهر الأنابيب</p>
            
            <div class="shop-item">
                <div>
                    <h3>أنابيب زجاجية (افتراضي)</h3>
                    <p>المظهر الأساسي</p>
                </div>
                <button class="btn" onclick="buyTheme('default', 0)">مُفعل</button>
            </div>

            <div class="shop-item">
                <div>
                    <h3>أنابيب ذهبية</h3>
                    <p>مظهر فاخر</p>
                </div>
                <button class="btn" onclick="buyTheme('gold', 50)">50 ⭐</button>
            </div>

            <div class="shop-item">
                <div>
                    <h3>أنابيب نيون</h3>
                    <p>توهج قوي</p>
                </div>
                <button class="btn" onclick="buyTheme('neon', 100)">100 ⭐</button>
            </div>

            <button class="btn" style="margin-top: 20px; background: #ff3333;" onclick="closeShop()">إغلاق</button>
        </div>
    </div>

    <script>
        // --- إعدادات اللعبة ---
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#eccc68', '#9b59b6', '#00d2d3', '#ff6b81'];
        const container = document.getElementById('tubes-container');
        const movesLabel = document.getElementById('moves');
        const levelLabel = document.getElementById('level');
        const coinsLabel = document.getElementById('coins');
        
        let tubes = [];
        let history = [];
        let moves = 0;
        let selectedTube = null;
        let currentLevel = 1;
        let coins = parseInt(localStorage.getItem('gameCoins')) || 0;
        let currentTheme = localStorage.getItem('gameTheme') || 'default';
        let isAnimating = false;

        // تحديث العملات في الواجهة
        coinsLabel.innerText = coins + " ⭐";

        // --- الأصوات (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'select') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'pour') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- إنشاء النجوم في الخلفية ---
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                let size = Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 1) + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // --- إعداد المرحلة ---
        function setupLevel() {
            container.innerHTML = '';
            tubes = [];
            history = [];
            moves = 0;
            movesLabel.innerText = moves;
            selectedTube = null;
            levelLabel.innerText = currentLevel;
            document.getElementById('win-screen').style.display = 'none';

            // توزيع الصعوبة (مستويات أعلى = ألوان أكثر وأنابيب أكثر)
            let numColors = Math.min(3 + Math.floor(currentLevel / 2), 8); 
            let emptyTubes = 2;
            
            let levelColors = [];
            for(let i=0; i<numColors; i++) {
                for(let j=0; j<4; j++) levelColors.push(colors[i]);
            }

            // خلط عشوائي
            levelColors.sort(() => Math.random() - 0.5);

            // توزيع الألوان
            for (let i = 0; i < numColors; i++) {
                let tubeData = levelColors.slice(i * 4, (i + 1) * 4);
                tubes.push(tubeData);
            }
            for (let i = 0; i < emptyTubes; i++) {
                tubes.push([]);
            }

            renderTubes();
        }

        // --- رسم الأنابيب ---
        function renderTubes() {
            container.innerHTML = '';
            
            // تحديد شكل الأنبوب بناءً على الثيم
            let tubeClass = 'tube';
            if (currentTheme === 'gold') tubeClass += ' gold-tube';
            if (currentTheme === 'neon') tubeClass += ' neon-tube';

            tubes.forEach((tubeData, index) => {
                let tubeEl = document.createElement('div');
                tubeEl.className = tubeClass;
                if (selectedTube === index) tubeEl.classList.add('selected');
                
                tubeData.forEach(colorHex => {
                    let liquid = document.createElement('div');
                    liquid.className = 'liquid';
                    liquid.style.backgroundColor = colorHex;
                    if (currentTheme === 'neon') liquid.style.boxShadow = `0 0 10px ${colorHex}, inset 0 5px 10px rgba(255,255,255,0.4)`;
                    tubeEl.appendChild(liquid);
                });

                tubeEl.onclick = () => handleTubeClick(index);
                container.appendChild(tubeEl);
            });
        }

        // --- التفاعل ---
        function handleTubeClick(index) {
            if (isAnimating) return;

            if (selectedTube === null) {
                if (tubes[index].length > 0) {
                    selectedTube = index;
                    playSound('select');
                    renderTubes();
                }
            } else if (selectedTube === index) {
                selectedTube = null;
                renderTubes();
            } else {
                let fromTube = tubes[selectedTube];
                let toTube = tubes[index];

                if (toTube.length >= 4) {
                    playSound('error');
                    selectedTube = null;
                    renderTubes();
                    return;
                }

                let colorToMove = fromTube[fromTube.length - 1];
                
                if (toTube.length === 0 || toTube[toTube.length - 1] === colorToMove) {
                    // حفظ الحالة للتراجع
                    history.push(JSON.parse(JSON.stringify(tubes)));

                    let count = 0;
                    for (let i = fromTube.length - 1; i >= 0; i--) {
                        if (fromTube[i] === colorToMove && toTube.length + count < 4) {
                            count++;
                        } else break;
                    }

                    for (let i = 0; i < count; i++) {
                        toTube.push(fromTube.pop());
                    }

                    moves++;
                    movesLabel.innerText = moves;
                    selectedTube = null;
                    playSound('pour');
                    renderTubes();
                    
                    setTimeout(checkWin, 300); // تأخير بسيط عشان الحركة تكتمل
                } else {
                    playSound('error');
                    selectedTube = null;
                    renderTubes();
                }
            }
        }

        // --- التراجع ---
        function undoMove() {
            if (history.length > 0 && !isAnimating) {
                tubes = history.pop();
                moves = Math.max(0, moves - 1);
                movesLabel.innerText = moves;
                selectedTube = null;
                playSound('select');
                renderTubes();
            }
        }

        // --- فحص الفوز ---
        function checkWin() {
            let isWin = true;
            for (let tube of tubes) {
                if (tube.length > 0) {
                    if (tube.length !== 4 || new Set(tube).size !== 1) {
                        isWin = false;
                        break;
                    }
                }
            }
            if (isWin) {
                isAnimating = true;
                playSound('win');
                coins += 20; // مكافأة الفوز
                localStorage.setItem('gameCoins', coins);
                coinsLabel.innerText = coins + " ⭐";
                
                document.getElementById('win-screen').style.display = 'flex';
                createConfetti();
                isAnimating = false;
            }
        }

        // --- المستوى التالي ---
        function nextLevel() {
            currentLevel++;
            setupLevel();
        }

        // --- المتجر ---
        function openShop() {
            document.getElementById('shop-screen').style.display = 'flex';
        }
        function closeShop() {
            document.getElementById('shop-screen').style.display = 'none';
        }
        function buyTheme(theme, price) {
            if (currentTheme === theme) return;
            if (coins >= price) {
                coins -= price;
                currentTheme = theme;
                localStorage.setItem('gameCoins', coins);
                localStorage.setItem('gameTheme', theme);
                coinsLabel.innerText = coins + " ⭐";
                playSound('win');
                renderTubes();
                // تغيير لون الخلفية بناءً على الثيم
                if (theme === 'gold') document.body.style.background = 'linear-gradient(to bottom, #2b1a00, #4a3000, #0f0c29)';
                else if (theme === 'neon') document.body.style.background = 'linear-gradient(to bottom, #001f2b, #00334a, #0f0c29)';
                else document.body.style.background = 'linear-gradient(to bottom, #24243e, #302b63, #0f0c29)';
            } else {
                playSound('error');
                alert('لا تملك نجوم كافية!');
            }
        }

        // --- تأثيرات الفوز (قصاصات ورقية) ---
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                let confetti = document.createElement('div');
                confetti.style.position = 'absolute';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.zIndex = '100';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                document.body.appendChild(confetti);

                let animation = confetti.animate([
                    { transform: `translateY(0) rotate(0deg)` },
                    { transform: `translateY(100vh) rotate(${Math.random() * 720}deg)` }
                ], {
                    duration: Math.random() * 2000 + 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });

                animation.onfinish = () => confetti.remove();
            }
        }

        // إضافة CSS للثيمات
        const style = document.createElement('style');
        style.innerHTML = `
            .tube.gold-tube { border-color: #ffcc00; box-shadow: inset 0 0 20px rgba(255,204,0,0.3), 0 10px 20px rgba(0,0,0,0.4); }
            .tube.gold-tube::before { border-color: #ffcc00; }
            .tube.neon-tube { border-color: #00ffff; box-shadow: inset 0 0 20px rgba(0,255,255,0.3), 0 10px 20px rgba(0,0,0,0.4); }
            .tube.neon-tube::before { border-color: #00ffff; }
        `;
        document.head.appendChild(style);

        // تشغيل اللعبة
        if (currentTheme === 'gold') document.body.style.background = 'linear-gradient(to bottom, #2b1a00, #4a3000, #0f0c29)';
        else if (currentTheme === 'neon') document.body.style.background = 'linear-gradient(to bottom, #001f2b, #00334a, #0f0c29)';
        
        setupLevel();

    </script>
</body>
</html>
