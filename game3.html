<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Color Sort - By Osama</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { 
            margin: 0; padding: 0; overflow: hidden; background: #0a0915;
            background: linear-gradient(180deg, #0a0915 0%, #1a1025 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; color: white; touch-action: none;
        }

        #game-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .top-bar {
            position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px;
            font-size: 18px; font-weight: bold; color: #ccc;
        }
        .top-bar div { background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        
        .level-title { position: absolute; top: 70px; font-size: 24px; font-weight: 900; letter-spacing: 2px; color: #e0e0e0; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

        #tubes-container {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end;
            gap: 15px; max-width: 380px; margin-top: 50px;
        }

        .tube {
            width: 65px; height: 220px; border: 3px solid rgba(255,255,255,0.3);
            border-top: none; border-radius: 0 0 30px 30px; position: relative;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(5px);
            display: flex; flex-direction: column-reverse; padding: 3px; overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer; transition: transform 0.2s;
        }
        
        /* حافة الأنبوب العلوية */
        .tube::before {
            content: ''; position: absolute; top: -3px; left: -3px; right: -3px; height: 10px;
            border: 3px solid rgba(255,255,255,0.5); border-radius: 50%; z-index: 5;
        }

        .tube.selected { transform: translateY(-20px); border-color: rgba(0, 255, 255, 0.8); box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.3), 0 15px 25px rgba(0,0,0,0.6); }
        .tube.selected::before { border-color: rgba(0, 255, 255, 0.8); }

        .liquid {
            width: 100%; flex: 0 0 45px; border-radius: 5px; margin-top: 2px;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.3), inset 0 -5px 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 9, 21, 0.95); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20;
        }
        .overlay h1 { margin: 0 0 10px 0; font-size: 42px; font-weight: 900; color: #00ffff; text-shadow: 0 0 20px #00ffff; }
        .overlay p { margin: 0 0 30px 0; color: #aaa; font-size: 18px; }
        button { padding: 12px 30px; font-size: 18px; font-weight: bold; background: #00ffff; color: #000; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,255,0.5); }

        #credit { position: absolute; bottom: 15px; font-size: 14px; color: rgba(255,255,255,0.4); font-weight: bold; }
        #credit strong { color: #00ffff; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="top-bar">
            <div>Moves: <span id="moves">0</span></div>
            <div>Best: <span id="best">-</span></div>
        </div>
        
        <div class="level-title">LEVEL <span id="level">1</span></div>

        <div id="tubes-container"></div>

        <div id="win-screen" class="overlay">
            <h1>LEVEL CLEARED!</h1>
            <p>You sorted the colors.</p>
            <button onclick="nextLevel()">NEXT LEVEL</button>
        </div>

        <div id="credit">Programmed by <strong>Osama</strong></div>
    </div>

    <script>
        const colors = ['#ff3366', '#ff9933', '#ffff33', '#33ff99', '#33ccff', '#cc33ff', '#ff3333', '#33ff33'];
        const container = document.getElementById('tubes-container');
        const movesLabel = document.getElementById('moves');
        const levelLabel = document.getElementById('level');
        
        let tubes = [];
        let moves = 0;
        let selectedTube = null;
        let currentLevel = 1;
        let isAnimating = false;

        // إعدادات المرحلة
        function setupLevel() {
            container.innerHTML = '';
            tubes = [];
            moves = 0;
            movesLabel.innerText = moves;
            selectedTube = null;
            levelLabel.innerText = currentLevel;
            document.getElementById('win-screen').style.display = 'none';

            // عدد الألوان والأنابيب (يزيد مع المستوى)
            let numColors = Math.min(3 + currentLevel, 8); 
            let emptyTubes = 2;
            
            // توليد الألوان
            let levelColors = [];
            for(let i=0; i<numColors; i++) {
                levelColors.push(colors[i]);
                levelColors.push(colors[i]);
                levelColors.push(colors[i]);
                levelColors.push(colors[i]); // 4 طبقات من كل لون
            }

            // خلط الألوان
            levelColors.sort(() => Math.random() - 0.5);

            // توزيع الألوان على الأنابيب
            for (let i = 0; i < numColors; i++) {
                let tubeData = levelColors.slice(i * 4, (i + 1) * 4);
                tubes.push(tubeData);
            }
            // إضافة الأنابيب الفارغة
            for (let i = 0; i < emptyTubes; i++) {
                tubes.push([]);
            }

            renderTubes();
        }

        function renderTubes() {
            container.innerHTML = '';
            tubes.forEach((tubeData, index) => {
                let tubeEl = document.createElement('div');
                tubeEl.className = 'tube';
                if (selectedTube === index) tubeEl.classList.add('selected');
                
                // رسم السوائل
                tubeData.forEach(colorHex => {
                    let liquid = document.createElement('div');
                    liquid.className = 'liquid';
                    liquid.style.backgroundColor = colorHex;
                    tubeEl.appendChild(liquid);
                });

                tubeEl.onclick = () => handleTubeClick(index);
                container.appendChild(tubeEl);
            });
        }

        function handleTubeClick(index) {
            if (isAnimating) return;

            if (selectedTube === null) {
                // اختيار أنبوب
                if (tubes[index].length > 0) {
                    selectedTube = index;
                    renderTubes();
                }
            } else if (selectedTube === index) {
                // إلغاء الاختيار
                selectedTube = null;
                renderTubes();
            } else {
                // محاولة النقل
                let fromTube = tubes[selectedTube];
                let toTube = tubes[index];

                if (toTube.length >= 4) {
                    // الأنبوب ممتلئ
                    selectedTube = null;
                    renderTubes();
                    return;
                }

                let colorToMove = fromTube[fromTube.length - 1];
                
                // التحقق من إمكانية النقل (إما فارغ أو نفس اللون)
                if (toTube.length === 0 || toTube[toTube.length - 1] === colorToMove) {
                    // نقل السوائل
                    let count = 0;
                    // عد السوائل المتتالية بنفس اللون
                    for (let i = fromTube.length - 1; i >= 0; i--) {
                        if (fromTube[i] === colorToMove && toTube.length + count < 4) {
                            count++;
                        } else {
                            break;
                        }
                    }

                    // تنفيذ النقل
                    for (let i = 0; i < count; i++) {
                        toTube.push(fromTube.pop());
                    }

                    moves++;
                    movesLabel.innerText = moves;
                    selectedTube = null;
                    renderTubes();
                    checkWin();
                } else {
                    // حركة خاطئة
                    selectedTube = null;
                    renderTubes();
                }
            }
        }

        function checkWin() {
            let isWin = true;
            for (let tube of tubes) {
                if (tube.length > 0) {
                    // لازم يكون 4 من نفس اللون
                    if (tube.length !== 4 || new Set(tube).size !== 1) {
                        isWin = false;
                        break;
                    }
                }
            }
            if (isWin) {
                document.getElementById('win-screen').style.display = 'flex';
            }
        }

        function nextLevel() {
            currentLevel++;
            setupLevel();
        }

        // بدء اللعبة
        setupLevel();
    </script>
</body>
</html>
