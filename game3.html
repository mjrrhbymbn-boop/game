<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Quest - تصميم محسن</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            /* خلفية متدرجة جميلة بدلاً من اللون السادة */
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 50%, #020617 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* --- لوحة المعلومات العلوية --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .title-area {
            text-align: right;
        }

        .title-area h1 {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(to right, #a78bfa, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-area p {
            font-size: 12px;
            color: #94a3b8;
        }

        .coins {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #fbbf24;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- بطاقة المستوى --- */
        .level-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .level-header h2 {
            font-size: 28px;
            font-weight: 900;
        }

        .level-header span {
            color: #94a3b8;
            font-size: 14px;
        }

        /* شريط التقدم */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 40%;
            height: 100%;
            background: linear-gradient(to right, #818cf8, #c084fc);
            border-radius: 10px;
        }

        /* الإحصائيات */
        .stats {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .stat-box {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 10px;
            text-align: center;
        }

        .stat-box .value {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 12px;
            color: #94a3b8;
        }

        /* --- منطقة اللعب (الأنابيب) --- */
        .play-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .instruction {
            font-size: 14px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tubes-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* تصميم الأنبوب */
        .tube {
            width: 65px;
            height: 240px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            border-radius: 0 0 30px 30px;
            position: relative;
            display: flex;
            flex-direction: column-reverse; /* الكرات تبدأ من الأسفل */
            align-items: center;
            padding-bottom: 5px;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.1), 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .tube:hover {
            transform: translateY(-5px);
        }

        /* الحافة العلوية للأنبوب */
        .tube::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -2px;
            right: -2px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* الكرات */
        .ball {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-bottom: 4px;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3), inset 5px 5px 10px rgba(255,255,255,0.4);
            transition: all 0.3s ease;
            position: relative;
        }
        
        /* لمعان الكرة */
        .ball::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 10px;
            width: 12px;
            height: 12px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            filter: blur(2px);
        }

        /* ألوان الكرات */
        .red { background: radial-gradient(circle at 30% 30%, #f87171, #dc2626); }
        .yellow { background: radial-gradient(circle at 30% 30%, #fde047, #ca8a04); }
        .cyan { background: radial-gradient(circle at 30% 30%, #67e8f9, #0891b2); }

    </style>
</head>
<body>

    <div class="game-container">
        <!-- لوحة المعلومات -->
        <div class="header">
            <div class="coins">
                <span>🪙</span>
                <span>140</span>
            </div>
            <div class="title-area">
                <h1>Color Quest</h1>
                <p>رحلة فرز الألوان</p>
            </div>
        </div>

        <div class="level-card">
            <div class="level-header">
                <div>
                    <h2>المستوى 2</h2>
                    <span>بداية الرحلة</span>
                </div>
                <span>تحديك الحالي</span>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="value">0</div>
                    <div class="label">الحركات</div>
                </div>
                <div class="stat-box">
                    <div class="value">00:04</div>
                    <div class="label">الوقت</div>
                </div>
                <div class="stat-box">
                    <div class="value">—</div>
                    <div class="label">أفضل حركات</div>
                </div>
            </div>
        </div>

        <!-- منطقة اللعب -->
        <div class="play-area">
            <div class="instruction">
                <span>✨</span> رتب كل لون في قارورة مستقلة
            </div>

            <div class="tubes-container">
                <!-- الأنبوب 1 -->
                <div class="tube">
                    <div class="ball yellow"></div>
                    <div class="ball yellow"></div>
                    <div class="ball yellow"></div>
                    <div class="ball red"></div>
                </div>
                <!-- الأنبوب 2 -->
                <div class="tube">
                    <div class="ball cyan"></div>
                    <div class="ball cyan"></div>
                    <div class="ball cyan"></div>
                    <div class="ball yellow"></div>
                </div>
                <!-- الأنبوب 3 -->
                <div class="tube">
                    <div class="ball red"></div>
                    <div class="ball red"></div>
                    <div class="ball red"></div>
                    <div class="ball cyan"></div>
                </div>
                <!-- الأنبوب الفارغ (تم تعديل حجمه ليكون متناسقاً) -->
                <div class="tube"></div>
            </div>
        </div>
    </div>

</body>
</html>
