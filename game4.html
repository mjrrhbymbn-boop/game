<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bubble Blast 3D - By Osama</title>
    <style>
        body { margin: 0; overflow: hidden; background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a15 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box; z-index: 10;
        }

        #score-board {
            color: #fff; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px #00ffff;
            text-align: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 20px;
            border: 1px solid rgba(0,255,255,0.3); backdrop-filter: blur(5px);
        }
        #score-board span { color: #00ffff; }

        #next-bubble-ui {
            display: flex; flex-direction: column; align-items: center; margin-top: 15px; color: #aaa; font-size: 12px; font-weight: bold;
        }
        #next-bubble-ui div { width: 30px; height: 30px; border-radius: 50%; margin-top: 5px; box-shadow: 0 0 10px rgba(255,255,255,0.3); }

        .bottom-bar { display: flex; justify-content: space-between; width: 100%; pointer-events: auto; }
        .btn { 
            padding: 10px 20px; font-size: 14px; font-weight: bold; background: rgba(255,255,255,0.1); 
            color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 25px; 
            cursor: pointer; backdrop-filter: blur(5px); transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }

        #credit { position: absolute; bottom: 20px; right: 20px; color: rgba(255,255,255,0.3); font-size: 12px; font-weight: bold; pointer-events: none; }
        #credit strong { color: #ff00ff; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 21, 0.95); backdrop-filter: blur(10px);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; box-sizing: border-box;
        }
        .overlay h1 { margin: 0 0 10px 0; font-size: 36px; font-weight: 900; color: #00ffff; text-shadow: 0 0 20px #00ffff; text-align: center;}
        .overlay p { margin: 0 0 20px 0; color: #aaa; font-size: 16px; text-align: center;}
        
        .shop-item { 
            width: 90%; max-width: 300px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .shop-item h3 { font-size: 14px; margin: 0; }
        .shop-item p { font-size: 11px; color: #aaa; margin: 5px 0 0 0; }

        #aim-line {
            position: absolute; bottom: 100px; left: 50%; width: 2px; height: 250px;
            background: linear-gradient(to top, rgba(0,255,255,0), rgba(0,255,255,0.6));
            transform-origin: bottom center; pointer-events: none; z-index: 5;
            display: none; /* نخفيها ونخلي السهم يشتغل */
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div style="display: flex; flex-direction: column; align-items: center;">
            <div id="score-board">SCORE: <span id="score-val">0</span></div>
            <div id="next-bubble-ui">NEXT <div id="next-color-indicator"></div></div>
        </div>
        
        <div class="bottom-bar">
            <button class="btn" onclick="openShop()">🛍️ SHOP</button>
            <button class="btn" onclick="location.reload()">🔄 RESTART</button>
        </div>
    </div>

    <div id="credit">Programmed by <strong>Osama</strong></div>

    <!-- شاشة الفوز -->
    <div id="win-screen" class="overlay">
        <h1>LEVEL CLEAR!</h1>
        <p>You popped them all.</p>
        <button class="btn" style="background:#00ffff; color:#000; padding:15px 30px;" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <!-- شاشة الخسارة -->
    <div id="lose-screen" class="overlay">
        <h1 style="color:#ff3333; text-shadow: 0 0 20px #ff3333;">GAME OVER</h1>
        <p>The bubbles reached the bottom.</p>
        <button class="btn" style="background:#ff3333; color:#fff; padding:15px 30px;" onclick="location.reload()">TRY AGAIN</button>
    </div>

    <!-- المتجر -->
    <div id="shop-screen" class="overlay">
        <h1 style="color:#ffcc00; text-shadow: 0 0 20px #ffcc00;">SHOP</h1>
        <p>Buy cool themes!</p>
        
        <div class="shop-item">
            <div><h3>Default Bubbles</h3></div>
            <button class="btn" onclick="buyTheme('default', 0)">ACTIVE</button>
        </div>
        <div class="shop-item">
            <div><h3>Neon Bubbles</h3><p>Glowing effect</p></div>
            <button class="btn" onclick="buyTheme('neon', 50)">50 ⭐</button>
        </div>
        <div class="shop-item">
            <div><h3>Metallic Bubbles</h3><p>Shiny metal look</p></div>
            <button class="btn" onclick="buyTheme('metal', 100)">100 ⭐</button>
        </div>

        <button class="btn" style="margin-top: 20px; background: #ff3333;" onclick="closeShop()">CLOSE</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- إعدادات المشهد ---
        const scene = new THREE.Scene();
        // إزالة الضباب ليكون واضحاً
        // scene.fog = new THREE.FogExp2(0x0a0a1a, 0.05);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        // تعديل موضع الكاميرا لتناسب الشاشات الطويلة
        camera.position.set(0, 0, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- الإضاءة ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00ffff, 2, 50);
        pointLight.position.set(0, -10, 10);
        scene.add(pointLight);

        // --- إعدادات الفقاعات ---
        const colors = [0xff3366, 0x33ff66, 0x3366ff, 0xffff33, 0xff33ff];
        const bubbleRadius = 0.9; // تصغير الحجم
        const spacingX = bubbleRadius * 2 + 0.1;
        const spacingY = bubbleRadius * Math.sqrt(3) + 0.1;

        // تقليل عدد الأعمدة والصفوف عشان الشاشة
        const gridCols = 9; 
        const gridRows = 7; 

        let bubbles = [];
        let particles = [];
        const bubbleGeo = new THREE.SphereGeometry(bubbleRadius, 32, 32);
        let currentTheme = 'default';

        // إنشاء فقاعة
        function createBubbleMesh(colorIndex) {
            let mat;
            if (currentTheme === 'neon') {
                mat = new THREE.MeshStandardMaterial({ color: colors[colorIndex], emissive: colors[colorIndex], emissiveIntensity: 0.8, roughness: 0.1 });
            } else if (currentTheme === 'metal') {
                mat = new THREE.MeshStandardMaterial({ color: colors[colorIndex], metalness: 0.9, roughness: 0.1 });
            } else {
                mat = new THREE.MeshStandardMaterial({ color: colors[colorIndex], roughness: 0.3, metalness: 0.1 });
            }
            return new THREE.Mesh(bubbleGeo, mat);
        }

        // إنشاء الشبكة الأولية
        function initGrid() {
            for (let row = 0; row < gridRows; row++) {
                for (let col = 0; col < gridCols; col++) {
                    let offsetX = (row % 2 === 0) ? 0 : spacingX / 2;
                    let x = (col * spacingX) - (gridCols * spacingX) / 2 + spacingX / 2 + offsetX;
                    let y = (row * spacingY) - (gridRows * spacingY) / 2 + spacingY / 2 + 8;
                    
                    if (Math.random() > 0.1) {
                        let colorIndex = Math.floor(Math.random() * colors.length);
                        let bubble = createBubbleMesh(colorIndex);
                        bubble.position.set(x, y, 0);
                        bubble.userData = { color: colorIndex, isGrid: true };
                        scene.add(bubble);
                        bubbles.push(bubble);
                    }
                }
            }
        }

        // --- اللاعب ---
        let currentBubble;
        let nextColor;
        let isShooting = false;
        let aimAngle = 0; // بالراديان

        function setupPlayer() {
            if (currentBubble) scene.remove(currentBubble);
            let colorIndex = nextColor !== undefined ? nextColor : Math.floor(Math.random() * colors.length);
            currentBubble = createBubbleMesh(colorIndex);
            currentBubble.position.set(0, -12, 0);
            currentBubble.userData = { color: colorIndex, isGrid: false };
            scene.add(currentBubble);

            nextColor = Math.floor(Math.random() * colors.length);
            updateNextColorUI();
        }

        function updateNextColorUI() {
            const hex = '#' + colors[nextColor].toString(16).padStart(6, '0');
            document.getElementById('next-color-indicator').style.backgroundColor = hex;
            document.getElementById('next-color-indicator').style.boxShadow = `0 0 15px ${hex}`;
        }

        // --- التصويب ---
        function handlePointerMove(e) {
            if (isShooting) return;
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (!clientX) return;

            // تحويل الشاشة لإحداثيات
            let rect = renderer.domElement.getBoundingClientRect();
            let mouseX = ((clientX - rect.left) / window.innerWidth) * 2 - 1;
            let mouseY = -((clientY - rect.top) / window.innerHeight) * 2 + 1;

            let vector = new THREE.Vector3(mouseX, mouseY, 0.5);
            vector.unproject(camera);
            let dir = vector.sub(camera.position).normalize();
            
            // حساب الزاوية
            let dx = dir.x;
            let dy = dir.y;
            
            // منع التصويب للأسفل
            if (dy < 0.1) dy = 0.1;
            
            aimAngle = Math.atan2(dx, dy); 
            
            // تدوير الفقاعة الحالية عشان تحس بالاتجاه
            if(currentBubble) currentBubble.rotation.z = -aimAngle;
            
            // إظهار خط التصويب (اختياري)
            const aimLine = document.getElementById('aim-line');
            aimLine.style.display = 'block';
            aimLine.style.transform = `translateX(-50%) rotate(${aimAngle}rad)`;
        }

        document.addEventListener('mousemove', handlePointerMove);
        document.addEventListener('touchmove', handlePointerMove, { passive: false });

        function shootBubble() {
            if (isShooting) return;
            isShooting = true;
            document.getElementById('aim-line').style.display = 'none';

            let speed = 0.8; // سرعة أفضل
            let vx = Math.sin(aimAngle) * speed;
            let vy = Math.cos(aimAngle) * speed;

            let shootInterval = setInterval(() => {
                currentBubble.position.x += vx;
                currentBubble.position.y += vy;

                // ارتداد الجدران
                let maxX = (gridCols * spacingX) / 2;
                if (currentBubble.position.x > maxX) { currentBubble.position.x = maxX; vx = -vx; }
                if (currentBubble.position.x < -maxX) { currentBubble.position.x = -maxX; vx = -vx; }

                // فحص الاصطدام
                for (let i = 0; i < bubbles.length; i++) {
                    let b = bubbles[i];
                    let dist = currentBubble.position.distanceTo(b.position);
                    if (dist < bubbleRadius * 2) {
                        clearInterval(shootInterval);
                        snapBubble();
                        return;
                    }
                }

                // وصل للسقف
                if (currentBubble.position.y > (gridRows * spacingY) / 2 + 8) {
                    clearInterval(shootInterval);
                    snapBubble();
                }

                // وصل للأسفل (خسارة)
                if (currentBubble.position.y < -12) {
                    clearInterval(shootInterval);
                    showLoseScreen();
                }

            }, 10);
        }

        document.addEventListener('mouseup', () => { if(!isShooting) shootBubble(); });
        document.addEventListener('touchend', () => { if(!isShooting) shootBubble(); });

        // تثبيت الفقاعة
        function snapBubble() {
            // نجعلها جزء من الشبكة
            let newBubble = createBubbleMesh(currentBubble.userData.color);
            newBubble.position.copy(currentBubble.position);
            newBubble.userData = { color: currentBubble.userData.color, isGrid: true };
            scene.add(newBubble);
            bubbles.push(newBubble);
            
            scene.remove(currentBubble);

            // فحص التطابق
            checkMatches(newBubble);

            // فحص الفوز
            if (bubbles.length === 0) {
                document.getElementById('win-screen').style.display = 'flex';
                return;
            }

            // تجهيز الفقاعة القادمة
            setupPlayer();
            isShooting = false;
        }

        function checkMatches(startBubble) {
            let color = startBubble.userData.color;
            let matches = [startBubble];
            let queue = [startBubble];
            let checked = new Set();
            checked.add(startBubble);

            // خوارزمية BFS للبحث عن المتجاورين
            while (queue.length > 0) {
                let current = queue.shift();
                for (let i = 0; i < bubbles.length; i++) {
                    let b = bubbles[i];
                    if (!checked.has(b) && b.userData.color === color) {
                        // المسافة للفحص (تقريبية)
                        if (b.position.distanceTo(current.position) < bubbleRadius * 2.5) {
                            checked.add(b);
                            matches.push(b);
                            queue.push(b);
                        }
                    }
                }
            }

            if (matches.length >= 3) {
                matches.forEach(m => {
                    createExplosion(m.position.x, m.position.y, colors[color]);
                    scene.remove(m);
                    let index = bubbles.indexOf(m);
                    if (index > -1) bubbles.splice(index, 1);
                });
                
                // نقاط
                let scoreVal = document.getElementById('score-val');
                let newScore = parseInt(scoreVal.innerText) + (matches.length * 10);
                scoreVal.innerText = newScore;
                
                // جوائز (نجوم) بسيطة
                // coins += matches.length; // لو حابب تضيف نظام نجوم
            }
        }

        // --- تأثير الانفجار ---
        function createExplosion(x, y, color) {
            for (let i = 0; i < 8; i++) {
                let pGeo = new THREE.SphereGeometry(0.1, 8, 8);
                let pMat = new THREE.MeshBasicMaterial({ color: color });
                let particle = new THREE.Mesh(pGeo, pMat);
                particle.position.set(x, y, 0);
                particle.userData = {
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    life: 1.0
                };
                scene.add(particle);
                particles.push(particle);
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.position.x += p.userData.vx;
                p.position.y += p.userData.vy;
                p.userData.life -= 0.05;
                p.scale.set(p.userData.life, p.userData.life, p.userData.life);

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        // --- المتجر (تغيير شكل الكور) ---
        function openShop() { document.getElementById('shop-screen').style.display = 'flex'; }
        function closeShop() { document.getElementById('shop-screen').style.display = 'none'; }
        
        function buyTheme(theme, price) {
            // هنا ممكن تضيف نظام النجوم، بس للتبسيط راح نعتبرها مفتوحة
            currentTheme = theme;
            closeShop();
            // إعادة بناء الكور بالشكل الجديد
            bubbles.forEach(b => {
                scene.remove(b);
                let newMesh = createBubbleMesh(b.userData.color);
                newMesh.position.copy(b.position);
                newMesh.userData = b.userData;
                scene.add(newMesh);
            });
            // إعادة بناء الكور الحالية
            if(currentBubble) scene.remove(currentBubble);
            setupPlayer();
        }

        // --- تشغيل ---
        function showLoseScreen() {
            document.getElementById('lose-screen').style.display = 'flex';
        }

        function animate() {
            requestAnimationFrame(animate);
            updateParticles();
            
            // تدوير خفيف
            bubbles.forEach(b => {
                b.rotation.x += 0.005;
            });

            renderer.render(scene, camera);
        }

        // تعديل حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            // تعديل الكاميرا عشان تظل الشاشة متناسقة
            if (window.innerWidth < window.innerHeight) {
                camera.position.z = 30; // جوال
            } else {
                camera.position.z = 20; // كمبيوتر
            }
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // البدء
        initGrid();
        setupPlayer();
        animate();
        
        // تصغير الكاميرا فوراً لو كان جوال
        if (window.innerWidth < window.innerHeight) camera.position.z = 30;

    </script>
</body>
</html>
