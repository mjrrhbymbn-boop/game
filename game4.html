<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bubble Blast Pro - By Osama</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            overflow: hidden; background: radial-gradient(circle at center, #1a1a2e 0%, #050510 100%); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            touch-action: none; /* منع السكرول والزوم */
            width: 100vw; height: 100vh;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 15px; z-index: 10;
        }

        .top-ui { display: flex; justify-content: space-between; align-items: flex-start; }
        
        #score-board {
            color: #fff; font-size: 20px; font-weight: 900; text-shadow: 0 0 10px #00ffff;
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 15px;
            border: 1px solid rgba(0,255,255,0.3); backdrop-filter: blur(5px);
        }
        #score-board span { color: #00ffff; }

        .next-bubble-ui {
            display: flex; flex-direction: column; align-items: center; color: #fff; font-size: 10px; font-weight: bold;
            background: rgba(0,0,0,0.5); padding: 5px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
        }
        #next-color-indicator { 
            width: 25px; height: 25px; border-radius: 50%; margin-top: 5px; 
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 0 0 10px currentColor; 
        }

        .bottom-bar { display: flex; justify-content: space-between; width: 100%; pointer-events: auto; padding-bottom: 10px; }
        .btn { 
            padding: 10px 20px; font-size: 14px; font-weight: bold; background: rgba(255,255,255,0.1); 
            color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; 
            cursor: pointer; backdrop-filter: blur(5px); transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

        #credit { position: absolute; bottom: 10px; right: 15px; color: rgba(255,255,255,0.3); font-size: 11px; font-weight: bold; pointer-events: none; }
        #credit strong { color: #ff00ff; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 21, 0.95); backdrop-filter: blur(10px);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px;
        }
        .overlay h1 { margin: 0 0 10px 0; font-size: 32px; font-weight: 900; color: #00ffff; text-shadow: 0 0 20px #00ffff; text-align: center;}
        .overlay p { margin: 0 0 20px 0; color: #aaa; font-size: 16px; text-align: center;}
        
        .shop-item { 
            width: 90%; max-width: 300px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .shop-item h3 { font-size: 14px; margin: 0; color: #fff; }
        
        #aim-line {
            position: absolute; bottom: 60px; left: 50%; width: 4px; height: 300px;
            background: linear-gradient(to top, rgba(0,255,255,0), rgba(0,255,255,0.8));
            transform-origin: bottom center; pointer-events: none; z-index: 5;
            display: none; border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="top-ui">
            <div id="score-board">SCORE: <span id="score-val">0</span></div>
            <div class="next-bubble-ui">NEXT <div id="next-color-indicator"></div></div>
        </div>
        
        <div class="bottom-bar">
            <button class="btn" onclick="openShop()">🛍️ SHOP</button>
            <button class="btn" onclick="location.reload()">🔄 RESTART</button>
        </div>
    </div>

    <div id="credit">Programmed by <strong>Osama</strong></div>
    <div id="aim-line"></div>

    <!-- شاشة الفوز -->
    <div id="win-screen" class="overlay">
        <h1>LEVEL CLEAR!</h1>
        <p>You popped them all.</p>
        <button class="btn" style="background:#00ffff; color:#000; padding:15px 30px; font-size:18px;" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <!-- شاشة الخسارة -->
    <div id="lose-screen" class="overlay">
        <h1 style="color:#ff3333; text-shadow: 0 0 20px #ff3333;">GAME OVER</h1>
        <p>The bubbles reached the bottom.</p>
        <button class="btn" style="background:#ff3333; color:#fff; padding:15px 30px; font-size:18px;" onclick="location.reload()">TRY AGAIN</button>
    </div>

    <!-- المتجر -->
    <div id="shop-screen" class="overlay">
        <h1 style="color:#ffcc00; text-shadow: 0 0 20px #ffcc00;">SHOP</h1>
        <p>Change bubble style</p>
        
        <div class="shop-item">
            <div><h3>Default Style</h3></div>
            <button class="btn" onclick="buyTheme('default')">SELECT</button>
        </div>
        <div class="shop-item">
            <div><h3>Neon Glow</h3></div>
            <button class="btn" onclick="buyTheme('neon')">SELECT</button>
        </div>
        <div class="shop-item">
            <div><h3>Metallic</h3></div>
            <button class="btn" onclick="buyTheme('metal')">SELECT</button>
        </div>

        <button class="btn" style="margin-top: 20px; background: #ff3333; width: 80%;" onclick="closeShop()">CLOSE</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- إعدادات المشهد ---
        const scene = new THREE.Scene();
        
        // إعداد الكاميرا (تتعدل حسب مقاس الشاشة)
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 25); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // تحسين الأداء
        document.body.appendChild(renderer.domElement);

        // --- الإضاءة ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 10);
        scene.add(dirLight);
        const pointLight = new THREE.PointLight(0x00ffff, 1.5, 50);
        pointLight.position.set(0, -10, 10);
        scene.add(pointLight);

        // --- المتغيرات الأساسية ---
        const colors = [0xff3366, 0x33ff66, 0x3366ff, 0xffff33, 0xff33ff];
        const bubbleRadius = 0.85;
        const gridCols = 9; 
        const gridRows = 8; 
        const spacingX = bubbleRadius * 2;
        const spacingY = bubbleRadius * Math.sqrt(3);

        let bubbles = [];
        let particles = [];
        const bubbleGeo = new THREE.SphereGeometry(bubbleRadius, 32, 32);
        let currentTheme = 'default';

        // إنشاء فقاعة (Mesh)
        function createBubbleMesh(colorIndex) {
            let mat;
            if (currentTheme === 'neon') {
                mat = new THREE.MeshStandardMaterial({ color: colors[colorIndex], emissive: colors[colorIndex], emissiveIntensity: 0.8, roughness: 0.1 });
            } else if (currentTheme === 'metal') {
                mat = new THREE.MeshStandardMaterial({ color: colors[colorIndex], metalness: 0.9, roughness: 0.1 });
            } else {
                mat = new THREE.MeshStandardMaterial({ color: colors[colorIndex], roughness: 0.3, metalness: 0.1 });
            }
            return new THREE.Mesh(bubbleGeo, mat);
        }

        // --- توليد الشبكة (Hex Grid) بدون تداخل ---
        function initGrid() {
            let startY = (gridRows * spacingY) / 2;
            for (let row = 0; row < gridRows; row++) {
                for (let col = 0; col < gridCols; col++) {
                    // إزاحة الصفوف الفردية عشان ما تتداخل
                    let offsetX = (row % 2 === 0) ? 0 : spacingX / 2;
                    let x = (col * spacingX) - (gridCols * spacingX) / 2 + offsetX + (spacingX/2);
                    let y = startY - (row * spacingY);
                    
                    if (Math.random() > 0.1) {
                        let colorIndex = Math.floor(Math.random() * colors.length);
                        let bubble = createBubbleMesh(colorIndex);
                        bubble.position.set(x, y, 0);
                        bubble.userData = { color: colorIndex, isGrid: true };
                        scene.add(bubble);
                        bubbles.push(bubble);
                    }
                }
            }
        }

        // --- اللاعب ---
        let currentBubble;
        let nextColor;
        let isShooting = false;
        let aimAngle = 0; 

        function setupPlayer() {
            if (currentBubble) scene.remove(currentBubble);
            let colorIndex = nextColor !== undefined ? nextColor : Math.floor(Math.random() * colors.length);
            currentBubble = createBubbleMesh(colorIndex);
            currentBubble.position.set(0, -11, 0);
            currentBubble.userData = { color: colorIndex, isGrid: false };
            scene.add(currentBubble);

            nextColor = Math.floor(Math.random() * colors.length);
            updateNextColorUI();
        }

        function updateNextColorUI() {
            const hex = '#' + colors[nextColor].toString(16).padStart(6, '0');
            const indicator = document.getElementById('next-color-indicator');
            indicator.style.backgroundColor = hex;
            indicator.style.boxShadow = `0 0 15px ${hex}, inset 0 0 10px rgba(255,255,255,0.5)`;
        }

        // --- التصويب (سلس وسريع) ---
        function handlePointerMove(e) {
            if (isShooting) return;
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX === undefined) return;

            // حساب الزاوية باستخدام الرياضيات المباشرة (أسرع وأدق)
            let rect = renderer.domElement.getBoundingClientRect();
            let mouseX = clientX - rect.left;
            let mouseY = clientY - rect.top;
            
            // نقطة انطلاق الفقاعة على الشاشة
            let startX = rect.width / 2;
            let startY = rect.height - 100; // تقريباً مكان الكورة تحت

            let dx = mouseX - startX;
            let dy = mouseY - startY;

            // منع التصويب للأسفل
            if (dy > -20) dy = -20; 

            aimAngle = Math.atan2(dx, -dy); // الزاوية من المحور الصادي
            
            // تدوير الفقاعة الحالية
            if(currentBubble) currentBubble.rotation.z = -aimAngle;
            
            // تحريك خط التصويب
            const aimLine = document.getElementById('aim-line');
            aimLine.style.display = 'block';
            // نستخدم rotation بالسالب عشان RTL
            aimLine.style.transform = `translateX(-50%) rotate(${aimAngle}rad)`;
        }

        document.addEventListener('mousemove', handlePointerMove);
        document.addEventListener('touchmove', handlePointerMove, { passive: false });

        function shootBubble() {
            if (isShooting) return;
            isShooting = true;
            document.getElementById('aim-line').style.display = 'none';

            let speed = 0.8; 
            let vx = Math.sin(aimAngle) * speed;
            let vy = Math.cos(aimAngle) * speed;

            let shootInterval = setInterval(() => {
                currentBubble.position.x += vx;
                currentBubble.position.y += vy;

                // ارتداد الجدران
                let maxX = (gridCols * spacingX) / 2;
                if (currentBubble.position.x > maxX) { currentBubble.position.x = maxX; vx = -vx; }
                if (currentBubble.position.x < -maxX) { currentBubble.position.x = -maxX; vx = -vx; }

                // فحص الاصطدام
                for (let i = 0; i < bubbles.length; i++) {
                    let b = bubbles[i];
                    let dist = currentBubble.position.distanceTo(b.position);
                    if (dist < bubbleRadius * 2) {
                        clearInterval(shootInterval);
                        snapBubble();
                        return;
                    }
                }

                // وصل للسقف
                if (currentBubble.position.y > (gridRows * spacingY) / 2 + 5) {
                    clearInterval(shootInterval);
                    snapBubble();
                }

            }, 10);
        }

        document.addEventListener('mouseup', () => { if(!isShooting) shootBubble(); });
        document.addEventListener('touchend', () => { if(!isShooting) shootBubble(); });

        // تثبيت الفقاعة
        function snapBubble() {
            let newBubble = createBubbleMesh(currentBubble.userData.color);
            newBubble.position.copy(currentBubble.position);
            newBubble.userData = { color: currentBubble.userData.color, isGrid: true };
            scene.add(newBubble);
            bubbles.push(newBubble);
            scene.remove(currentBubble);

            checkMatches(newBubble);
            
            if (bubbles.length === 0) {
                document.getElementById('win-screen').style.display = 'flex';
                return;
            }

            // فحص الخسارة (إذا نزلت تحت خط معين)
            let minY = (gridRows * spacingY) / 2 - (gridRows * spacingY) - 2;
            if (newBubble.position.y < -8) {
                document.getElementById('lose-screen').style.display = 'flex';
                return;
            }

            setupPlayer();
            isShooting = false;
        }

        function checkMatches(startBubble) {
            let color = startBubble.userData.color;
            let matches = [startBubble];
            let queue = [startBubble];
            let checked = new Set();
            checked.add(startBubble);

            while (queue.length > 0) {
                let current = queue.shift();
                for (let i = 0; i < bubbles.length; i++) {
                    let b = bubbles[i];
                    if (!checked.has(b) && b.userData.color === color) {
                        if (b.position.distanceTo(current.position) < bubbleRadius * 2.3) {
                            checked.add(b);
                            matches.push(b);
                            queue.push(b);
                        }
                    }
                }
            }

            if (matches.length >= 3) {
                matches.forEach(m => {
                    createExplosion(m.position.x, m.position.y, colors[color]);
                    scene.remove(m);
                    let index = bubbles.indexOf(m);
                    if (index > -1) bubbles.splice(index, 1);
                });
                
                let scoreVal = document.getElementById('score-val');
                scoreVal.innerText = parseInt(scoreVal.innerText) + (matches.length * 10);
                
                // اهتزاز الشاشة
                renderer.domElement.style.transform = 'translate(2px, 2px)';
                setTimeout(() => renderer.domElement.style.transform = 'translate(-2px, -2px)', 50);
                setTimeout(() => renderer.domElement.style.transform = 'translate(0, 0)', 100);
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 8; i++) {
                let pGeo = new THREE.SphereGeometry(0.15, 8, 8);
                let pMat = new THREE.MeshBasicMaterial({ color: color });
                let particle = new THREE.Mesh(pGeo, pMat);
                particle.position.set(x, y, 0);
                particle.userData = {
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    life: 1.0
                };
                scene.add(particle);
                particles.push(particle);
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.position.x += p.userData.vx;
                p.position.y += p.userData.vy;
                p.userData.life -= 0.05;
                p.scale.set(p.userData.life, p.userData.life, p.userData.life);

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        function openShop() { document.getElementById('shop-screen').style.display = 'flex'; }
        function closeShop() { document.getElementById('shop-screen').style.display = 'none'; }
        
        function buyTheme(theme) {
            currentTheme = theme;
            closeShop();
            // إعادة بناء الكور بالشكل الجديد
            bubbles.forEach(b => {
                scene.remove(b);
                let newMesh = createBubbleMesh(b.userData.color);
                newMesh.position.copy(b.position);
                newMesh.userData = b.userData;
                scene.add(newMesh);
            });
            if(currentBubble) scene.remove(currentBubble);
            setupPlayer();
        }

        function animate() {
            requestAnimationFrame(animate);
            updateParticles();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initGrid();
        setupPlayer();
        animate();

    </script>
</body>
</html>
