<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Neon Singularity</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05010a; font-family:'Segoe UI',monospace; }
  canvas { display:block; cursor:crosshair; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  .hud { position:absolute; color:#0ff; font-size:14px; letter-spacing:1px; text-shadow:0 0 8px #0ff; }
  #score { top:20px; left:24px; font-size:22px; }
  #combo { top:20px; right:24px; font-size:18px; color:#f0f; text-shadow:0 0 8px #f0f; }
  #energyBar { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); width:300px; height:10px;
    background:#1a0a2a; border:1px solid #0ff; border-radius:5px; overflow:hidden; box-shadow:0 0 12px #0ff5; }
  #energyFill { height:100%; width:0%; background:linear-gradient(90deg,#0ff,#f0f); transition:width 0.2s; }
  #ultReady { position:absolute; bottom:44px; left:50%; transform:translateX(-50%); color:#f0f;
    font-size:12px; letter-spacing:3px; opacity:0; transition:opacity 0.3s; text-shadow:0 0 12px #f0f; }
  #ultReady.show { opacity:1; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  #startScreen { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center;
    align-items:center; background:radial-gradient(circle,#1a0030,#05010a); z-index:10; }
  #startScreen h1 { color:#0ff; font-size:52px; text-shadow:0 0 30px #0ff, 0 0 60px #0ff; letter-spacing:8px; }
  #startScreen p { color:#f0f; margin:20px 0; font-size:16px; letter-spacing:2px; }
  #startScreen button { margin-top:30px; padding:16px 48px; background:transparent; color:#0ff;
    border:2px solid #0ff; font-size:20px; letter-spacing:4px; cursor:pointer; border-radius:8px;
    box-shadow:0 0 20px #0ff8; transition:all 0.2s; }
  #startScreen button:hover { background:#0ff; color:#05010a; box-shadow:0 0 40px #0ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score" class="hud">0</div>
  <div id="combo" class="hud">x1</div>
  <div id="energyBar"><div id="energyFill"></div></div>
  <div id="ultReady">[ SPACE ] SINGULARITY PULSE</div>
</div>
<div id="startScreen">
  <h1>SINGULARITY</h1>
  <p>ram الفقاعات نحو النواة • ادمج الشحنات المتعاكسة</p>
  <p style="color:#0ff;font-size:13px">🟦 موجب • 🟥 سالب • ⚪ محايد (عازل)</p>
  <button id="startBtn">START</button>
</div>
<script>
// ================= SETUP =================
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H, CX, CY;
function resize() {
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
  CX = W/2; CY = H/2;
}
window.addEventListener('resize', resize); resize();

// ================= AUDIO ENGINE =================
const AC = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, dur=0.1, type='sine', vol=0.15, sweep=null) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  if (sweep) o.frequency.exponentialRampToValueAtTime(sweep, AC.currentTime + dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
function sfxShoot()  { playTone(600, 0.08, 'square', 0.08, 300); }
function sfxHit()    { playTone(220, 0.05, 'triangle', 0.1); }
function sfxPop(n)   { for(let i=0;i<n;i++) setTimeout(()=>playTone(400+i*80,0.12,'sine',0.12,800),i*40); }
function sfxUlt()    { playTone(80, 1.2, 'sawtooth', 0.2, 40); playTone(200,1.0,'sine',0.15,800); }
function sfxCombo()  { playTone(1200, 0.15, 'sine', 0.1, 1800); }

// ================= CONSTANTS =================
const CHARGES = [
  { name:'pos', color:'#00e5ff', glow:'#00e5ff', sign: +1 },
  { name:'neg', color:'#ff006e', glow:'#ff006e', sign: -1 },
  { name:'neu', color:'#cccccc', glow:'#888888', sign:  0 },
];
const RING_RADII = [90, 165, 240];   // 3 rings from core
const R = 20;                          // bubble radius
const CORE_R = 55;

// ================= STATE =================
let bubbles = [];      // {ring, index, charge, angle, alive, spawnScale}
let projectile = null;
let particles = [];
let waves = [];        // pulse waves from core
let score = 0, combo = 1, energy = 0;
let ultActive = 0;     // frames remaining of ult effect
let shake = 0;
let mouseAngle = -Math.PI/2;
let gameState = 'menu'; // menu | playing | gameover
let pulsePhase = 0;
let bubblesPerRing = [8, 12, 16];

// ================= INIT =================
function initGame() {
  bubbles = []; particles = []; waves = [];
  score = 0; combo = 1; energy = 0; ultActive = 0;
  for (let ri = 0; ri < RING_RADII.length; ri++) {
    const count = bubblesPerRing[ri];
    for (let i = 0; i < count; i++) {
      const charge = CHARGES[(Math.random()*3)|0];
      bubbles.push({
        ring: ri, index: i, total: count,
        angle: (i / count) * Math.PI * 2,
        charge, alive: true, spawnScale: 0,
      });
    }
  }
  updateHUD();
}

// ================= RENDERING =================
function drawCore() {
  // pulsing core
  const pulse = 1 + Math.sin(pulsePhase) * 0.08;
  // outer glow
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, CORE_R * 3 * pulse);
  grad.addColorStop(0, 'rgba(255,0,255,0.6)');
  grad.addColorStop(0.4, 'rgba(150,0,255,0.2)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(CX, CY, CORE_R * 3 * pulse, 0, Math.PI*2); ctx.fill();
  // core body
  ctx.beginPath(); ctx.arc(CX, CY, CORE_R * pulse, 0, Math.PI*2);
  const cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, CORE_R * pulse);
  cg.addColorStop(0, '#fff');
  cg.addColorStop(0.5, '#f0f');
  cg.addColorStop(1, '#300');
  ctx.fillStyle = cg; ctx.fill();
  ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2; ctx.stroke();
}

function drawWaves() {
  for (let i = waves.length-1; i >= 0; i--) {
    const w = waves[i];
    w.radius += w.speed;
    w.alpha *= 0.97;
    ctx.beginPath(); ctx.arc(CX, CY, w.radius, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(0,255,255,${w.alpha})`;
    ctx.lineWidth = w.width; ctx.stroke();
    if (w.alpha < 0.02) waves.splice(i,1);
  }
}

function drawBubbles() {
  for (const b of bubbles) {
    if (!b.alive) continue;
    if (b.spawnScale < 1) b.spawnScale = Math.min(1, b.spawnScale + 0.08);
    const radius = RING_RADII[b.ring];
    const x = CX + Math.cos(b.angle) * radius;
    const y = CY + Math.sin(b.angle) * radius;
    const drawR = R * b.spawnScale;
    // glow
    const gg = ctx.createRadialGradient(x, y, 0, x, y, drawR * 2);
    gg.addColorStop(0, b.charge.glow + 'aa');
    gg.addColorStop(1, b.charge.glow + '00');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x, y, drawR * 2, 0, Math.PI*2); ctx.fill();
    // body
    ctx.beginPath(); ctx.arc(x, y, drawR, 0, Math.PI*2);
    ctx.fillStyle = b.charge.color; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    // charge symbol
    ctx.fillStyle = '#000'; ctx.font = `bold ${drawR}px monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const sym = b.charge.sign > 0 ? '+' : b.charge.sign < 0 ? '−' : 'o';
    ctx.fillText(sym, x, y);
  }
}

function drawShooter() {
  const sx = CX + Math.cos(mouseAngle) * (Math.min(W,H)/2 - 30);
  const sy = CY + Math.sin(mouseAngle) * (Math.min(W,H)/2 - 30);
  // aim line
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(CX + Math.cos(mouseAngle) * CORE_R, CY + Math.sin(mouseAngle) * CORE_R);
  ctx.strokeStyle = 'rgba(0,255,255,0.3)'; ctx.lineWidth = 2;
  ctx.setLineDash([6,6]); ctx.stroke(); ctx.setLineDash([]);
  // shooter base
  ctx.beginPath(); ctx.arc(sx, sy, R*1.3, 0, Math.PI*2);
  ctx.fillStyle = '#0ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 20;
  ctx.fill(); ctx.shadowBlur = 0;
  // next charge indicator
  if (!projectile) {
    ctx.beginPath(); ctx.arc(sx, sy, R*0.7, 0, Math.PI*2);
    ctx.fillStyle = nextCharge.color; ctx.fill();
  }
}

function drawProjectile() {
  if (!projectile) return;
  const gg = ctx.createRadialGradient(projectile.x,projectile.y,0,projectile.x,projectile.y,R*2);
  gg.addColorStop(0, projectile.charge.color + 'ff');
  gg.addColorStop(1, projectile.charge.color + '00');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(projectile.x, projectile.y, R*2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(projectile.x, projectile.y, R, 0, Math.PI*2);
  ctx.fillStyle = projectile.charge.color; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#000'; ctx.font = `bold ${R}px monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const sym = projectile.charge.sign > 0 ? '+' : projectile.charge.sign < 0 ? '−' : 'o';
  ctx.fillText(sym, projectile.x, projectile.y);
}

function drawParticles() {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.05; p.vx *= 0.98; p.vy *= 0.98;
    p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function spawnExplosion(x, y, color, n=15) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 5;
    particles.push({
      x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      size: 3 + Math.random()*3, color, life: 1,
    });
  }
}

// ================= LOGIC =================
let nextCharge = CHARGES[0];
function pickNextCharge() { nextCharge = CHARGES[(Math.random()*3)|0]; }
pickNextCharge();

c.addEventListener('mousemove', e => {
  mouseAngle = Math.atan2(e.clientY - CY, e.clientX - CX);
});
c.addEventListener('click', () => {
  if (projectile || gameState !== 'playing') return;
  // start from shooter position
  const sx = CX + Math.cos(mouseAngle) * (Math.min(W,H)/2 - 30);
  const sy = CY + Math.sin(mouseAngle) * (Math.min(W,H)/2 - 30);
  // velocity points TOWARD the core direction (inward)
  const dir = Math.atan2(CY - sy, CX - sx);
  projectile = {
    x: sx, y: sy,
    vx: Math.cos(dir) * 11, vy: Math.sin(dir) * 11,
    charge: nextCharge,
  };
  pickNextCharge();
  sfxShoot();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && energy >= 100 && gameState === 'playing') {
    triggerUltimate();
  }
});

function triggerUltimate() {
  energy = 0;
  ultActive = 90;
  waves.push({ radius: CORE_R, speed: 8, alpha: 1, width: 6 });
  waves.push({ radius: CORE_R, speed: 5, alpha: 0.7, width: 3 });
  sfxUlt();
  shake = 20;
  // destroy all in outer two rings
  let killed = 0;
  for (const b of bubbles) {
    if (b.alive && b.ring >= 1) {
      b.alive = false; killed++;
      const rad = RING_RADII[b.ring];
      const x = CX + Math.cos(b.angle)*rad, y = CY + Math.sin(b.angle)*rad;
      spawnExplosion(x, y, b.charge.color, 10);
    }
  }
  score += killed * 30;
  updateHUD();
  // respawn after delay
  setTimeout(() => { if (gameState === 'playing') refill(); }, 800);
}

function refill() {
  // restore missing bubbles on all rings
  for (let ri = 0; ri < RING_RADII.length; ri++) {
    const count = bubblesPerRing[ri];
    for (let i = 0; i < count; i++) {
      const existing = bubbles.find(b => b.ring===ri && b.index===i);
      if (!existing) {
        bubbles.push({
          ring: ri, index: i, total: count,
          angle: (i/count)*Math.PI*2,
          charge: CHARGES[(Math.random()*3)|0], alive: true, spawnScale: 0,
        });
      } else if (!existing.alive) {
        existing.alive = true;
        existing.charge = CHARGES[(Math.random()*3)|0];
        existing.spawnScale = 0;
      }
    }
  }
}

function findHitBubble(px, py) {
  let best = null, bestD = R * 2;
  for (const b of bubbles) {
    if (!b.alive) continue;
    const rad = RING_RADII[b.ring];
    const bx = CX + Math.cos(b.angle)*rad;
    const by = CY + Math.sin(b.angle)*rad;
    const d = Math.hypot(px-bx, py-by);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

function getNeighbors(b) {
  // neighbors = adjacent indices on same ring, plus nearest on adjacent rings
  const out = [];
  for (const other of bubbles) {
    if (!other.alive || other === b) continue;
    if (other.ring === b.ring) {
      let diff = Math.abs(other.index - b.index);
      diff = Math.min(diff, b.total - diff);
      if (diff === 1) out.push(other);
    } else if (Math.abs(other.ring - b.ring) === 1) {
      // angular proximity
      let da = Math.abs(other.angle - b.angle);
      da = Math.min(da, Math.PI*2 - da);
      if (da < Math.PI / 6) out.push(other);
    }
  }
  return out;
}

function resolveHit(hit, incomingCharge) {
  sfxHit();
  // opposite charges -> merge & explode
  if (hit.charge.sign !== 0 && incomingCharge.sign !== 0 && hit.charge.sign !== incomingCharge.sign) {
    // cascade: explode cluster of same charge as hit
    explodeCluster(hit);
    return;
  }
  // same charge -> nothing special, just small pop if 3+ chain
  if (hit.charge.sign === incomingCharge.sign && incomingCharge.sign !== 0) {
    explodeCluster(hit);
    return;
  }
  // neutral — small visual reaction only
  const rad = RING_RADII[hit.ring];
  const x = CX + Math.cos(hit.angle)*rad, y = CY + Math.sin(hit.angle)*rad;
  spawnExplosion(x, y, hit.charge.color, 5);
}

function explodeCluster(start) {
  // BFS on same-charge neighbors
  const toKill = new Set();
  const stack = [start];
  const targetCharge = start.charge;
  while (stack.length) {
    const b = stack.pop();
    if (toKill.has(b) || !b.alive || b.charge !== targetCharge) continue;
    toKill.add(b);
    for (const n of getNeighbors(b)) if (!toKill.has(n)) stack.push(n);
  }
  if (toKill.size < 2) {
    // not enough for a chain — just one explodes if it was direct hit
    toKill.clear(); toKill.add(start);
  }
  let count = 0;
  for (const b of toKill) {
    b.alive = false;
    const rad = RING_RADII[b.ring];
    const x = CX + Math.cos(b.angle)*rad, y = CY + Math.sin(b.angle)*rad;
    spawnExplosion(x, y, b.charge.color, 12);
    count++;
  }
  const gain = count * 20 * combo;
  score += gain;
  combo = Math.min(combo + (count > 3 ? 1 : 0.3), 10);
  energy = Math.min(100, energy + count * 5);
  sfxPop(Math.min(count, 6));
  if (count >= 4) sfxCombo();
  shake = Math.min(shake + count * 1.5, 15);
  updateHUD();
}

function updateHUD() {
  document.getElementById('score').textContent = Math.floor(score).toLocaleString();
  document.getElementById('combo').textContent = 'x' + combo.toFixed(1);
  document.getElementById('energyFill').style.width = energy + '%';
  document.getElementById('ultReady').classList.toggle('show', energy >= 100);
}

// ================= MAIN LOOP =================
let lastTime = 0;
function loop(t) {
  const dt = t - lastTime; lastTime = t;
  pulsePhase += 0.05;

  // rotate bubbles slowly (orbit)
  if (gameState === 'playing') {
    const speed = 0.0015 * (1 + ultActive/90);
    for (const b of bubbles) b.angle += speed;
    if (ultActive > 0) ultActive--;

    // shoot update
    if (projectile) {
      projectile.x += projectile.vx;
      projectile.y += projectile.vy;
      // collision with bubbles
      const hit = findHitBubble(projectile.x, projectile.y);
      if (hit) {
        resolveHit(hit, projectile.charge);
        projectile = null;
      } else if (Math.hypot(projectile.x - CX, projectile.y - CY) < CORE_R) {
        // hit core
        sfxHit();
        spawnExplosion(projectile.x, projectile.y, projectile.charge.color, 8);
        combo = 1;
        projectile = null;
        updateHUD();
      }
      // went off screen
      else if (projectile.x < -50 || projectile.x > W+50 || projectile.y < -50 || projectile.y > H+50) {
        projectile = null;
      }
    }

    // combo decay
    combo = Math.max(1, combo - 0.003);

    // randomly spawn pulse waves
    if (Math.random() < 0.005) {
      waves.push({ radius: CORE_R, speed: 2, alpha: 0.4, width: 2 });
    }
  }

  // ---- DRAW ----
  ctx.fillStyle = '#05010a';
  ctx.fillRect(0, 0, W, H);
  // bg radial
  const bg = ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)/2);
  bg.addColorStop(0, 'rgba(50,0,80,0.5)');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // shake
  ctx.save();
  if (shake > 0.5) {
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    shake *= 0.9;
  }

  drawWaves();
  drawCore();
  drawBubbles();
  if (gameState === 'playing') drawShooter();
  drawProjectile();
  drawParticles();

  ctx.restore();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ================= START =================
document.getElementById('startBtn').addEventListener('click', () => {
  AC.resume();
  document.getElementById('startScreen').style.display = 'none';
  gameState = 'playing';
  initGame();
});
</script>
</body>
</html>
