<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gravity Inversion Bubble Shooter</title>
<style>
  body { margin:0; background:#0a0a14; display:flex; justify-content:center; align-items:center; height:100vh; font-family:monospace; color:#0ff; }
  canvas { border:2px solid #0ff; box-shadow:0 0 30px #0ff8; }
  #hud { position:absolute; top:10px; left:10px; font-size:14px; }
</style>
</head>
<body>
<div id="hud">Gravity: <span id="gdir">DOWN</span> | Next flip: <span id="timer">10</span>s</div>
<canvas id="c" width="480" height="640"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const COLS = 12, R = 20, ROW_H = Math.sqrt(3) * R;
const W = c.width, H = c.height;
const COLORS = ['#ff3366','#33ff88','#3399ff','#ffcc00','#cc33ff'];

let grid = [], shooter = {x: W/2, y: H - 40, angle: -Math.PI/2};
let projectile = null;
let gravityDir = 1;          // 1 = down, -1 = up
let flipTimer = 10, lastFlip = performance.now();
let score = 0;

// ---- init grid ----
function initGrid() {
  grid = [];
  for (let r = 0; r < 8; r++) {
    grid[r] = [];
    for (let col = 0; col < COLS; col++) {
      if (r % 2 === 0 || col < COLS - 1) {
        grid[r][col] = { color: COLORS[(Math.random()*COLORS.length)|0], alive: true };
      }
    }
  }
}
initGrid();

// ---- geometry ----
function cellPos(row, col) {
  const x = col * (2*R) + R + (row % 2) * R;
  const y = gravityDir === 1
    ? row * ROW_H + R
    : H - (row * ROW_H + R);
  return {x, y};
}

// ---- shooting ----
c.addEventListener('mousemove', e => {
  const rect = c.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  shooter.angle = Math.atan2(my - shooter.y, mx - shooter.x);
  shooter.angle = Math.max(-Math.PI + 0.2, Math.min(-0.2, shooter.angle));
});
c.addEventListener('click', () => {
  if (projectile) return;
  const color = COLORS[(Math.random()*COLORS.length)|0];
  projectile = {
    x: shooter.x, y: shooter.y,
    vx: Math.cos(shooter.angle) * 9,
    vy: Math.sin(shooter.angle) * 9,
    color
  };
});

// ---- physics & collision ----
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function snapToGrid(p) {
  let best = null, bestD = Infinity;
  for (let r = 0; r < 20; r++) {
    if (!grid[r]) grid[r] = [];
    for (let col = 0; col < COLS; col++) {
      if (grid[r][col]?.alive) continue;
      const {x, y} = cellPos(r, col);
      if (y < -R || y > H + R) continue;
      const d = dist(p, {x, y});
      if (d < bestD) { bestD = d; best = {r, col, x, y}; }
    }
  }
  if (best && bestD < 2*R) {
    if (!grid[best.r]) grid[best.r] = [];
    grid[best.r][best.col] = { color: p.color, alive: true };
    return best;
  }
  return null;
}

function neighbors(r, col) {
  const odd = r % 2;
  return [
    [r, col-1],[r, col+1],[r-1, col-1+odd],[r-1, col+odd],
    [r+1, col-1+odd],[r+1, col+odd]
  ].filter(([rr,cc]) => rr>=0 && cc>=0 && cc<COLS && grid[rr]?.[cc]?.alive);
}

function popCluster(r, col, color) {
  const stack = [[r,col]], seen = new Set(), cluster = [];
  while (stack.length) {
    const [rr,cc] = stack.pop();
    const k = rr+','+cc;
    if (seen.has(k)) continue;
    seen.add(k);
    if (grid[rr]?.[cc]?.alive && grid[rr][cc].color === color) {
      cluster.push([rr,cc]);
      for (const n of neighbors(rr,cc)) stack.push(n);
    }
  }
  if (cluster.length >= 3) {
    cluster.forEach(([rr,cc]) => grid[rr][cc].alive = false);
    score += cluster.length * 10;
    return true;
  }
  return false;
}

// ---- gravity inversion: drop floating bubbles ----
function dropFloating() {
  const anchored = new Set();
  // anchor row is the one closest to "ceiling" (top if gravity down, bottom if up)
  const startRow = gravityDir === 1 ? 0 : 7;
  for (let col = 0; col < COLS; col++) {
    if (grid[startRow]?.[col]?.alive) {
      const stack = [[startRow,col]];
      while (stack.length) {
        const [r,cc] = stack.pop();
        const k = r+','+cc;
        if (anchored.has(k)) continue;
        anchored.add(k);
        for (const [rr,ccc] of neighbors(r,cc)) stack.push([rr,ccc]);
      }
    }
  }
  // any alive cell not in anchored set falls
  for (let r = 0; r < grid.length; r++) {
    if (!grid[r]) continue;
    for (let col = 0; col < COLS; col++) {
      const cell = grid[r][col];
      if (cell?.alive && !anchored.has(r+','+col)) {
        // fell off — simulate by removing and reapplying at opposite side
        cell.alive = false;
        // spawn a new one from opposite side (living inversion)
        const newR = gravityDir === 1 ? 7 : 0;
        for (let cc = 0; cc < COLS; cc++) {
          if (!grid[newR]) grid[newR] = [];
          if (!grid[newR][cc]?.alive) {
            grid[newR][cc] = {color: cell.color, alive: true};
            break;
          }
        }
        score += 25;
      }
    }
  }
}

// ---- main loop ----
function loop(now) {
  // timer
  if (now - lastFlip > 1000) {
    lastFlip = now;
    flipTimer--;
    document.getElementById('timer').textContent = flipTimer;
    if (flipTimer <= 0) {
      flipTimer = 10;
      gravityDir *= -1;
      document.getElementById('gdir').textContent = gravityDir === 1 ? 'DOWN' : 'UP';
      dropFloating();
    }
  }

  // projectile
  if (projectile) {
    projectile.x += projectile.vx;
    projectile.y += projectile.vy;
    // wall bounce
    if (projectile.x < R || projectile.x > W - R) projectile.vx *= -1;
    // ceiling / floor
    if (projectile.y < R || projectile.y > H - R) {
      const hit = snapToGrid(projectile);
      if (hit) popCluster(hit.r, hit.col, projectile.color);
      projectile = null;
    } else {
      // collision with existing bubbles
      for (let r = 0; r < grid.length; r++) {
        if (!grid[r]) continue;
        for (let col = 0; col < COLS; col++) {
          if (grid[r][col]?.alive) {
            const p = cellPos(r,col);
            if (dist(projectile, p) < 2*R - 2) {
              const hit = snapToGrid(projectile);
              if (hit) popCluster(hit.r, hit.col, projectile.color);
              projectile = null;
              r = grid.length; break;
            }
          }
        }
      }
    }
  }

  // ---- render ----
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0,0,W,H);

  // grid
  for (let r = 0; r < grid.length; r++) {
    if (!grid[r]) continue;
    for (let col = 0; col < COLS; col++) {
      const cell = grid[r][col];
      if (!cell?.alive) continue;
      const {x,y} = cellPos(r,col);
      if (y < -R || y > H+R) continue;
      ctx.beginPath();
      ctx.arc(x, y, R-2, 0, Math.PI*2);
      ctx.fillStyle = cell.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.stroke();
    }
  }

  // shooter
  ctx.beginPath();
  ctx.arc(shooter.x, shooter.y, R, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(shooter.x, shooter.y);
  ctx.lineTo(shooter.x + Math.cos(shooter.angle)*40, shooter.y + Math.sin(shooter.angle)*40);
  ctx.strokeStyle = '#0ff';
  ctx.stroke();

  // projectile
  if (projectile) {
    ctx.beginPath();
    ctx.arc(projectile.x, projectile.y, R-2, 0, Math.PI*2);
    ctx.fillStyle = projectile.color;
    ctx.fill();
  }

  // score
  ctx.fillStyle = '#0ff';
  ctx.font = '14px monospace';
  ctx.fillText('Score: ' + score, 10, 20);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
