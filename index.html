<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>OS GAMES | ألعاب سريعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020;
    --surface: #151c33;
    --line: #26305a;
    --text: #eef2ff;
    --muted: #9aa5c9;
    --cyan: #38bdf8;
    --amber: #fbbf24;
    --pink: #f472b6;
    --green: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
    background:
      radial-gradient(600px 300px at 85% -5%, rgba(56,189,248,.18), transparent 70%),
      radial-gradient(500px 300px at 10% 105%, rgba(244,114,182,.12), transparent 70%),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { text-align: center; margin: 28px 0 30px; }
  .logo {
    font-size: clamp(2.6rem, 11vw, 4rem);
    font-weight: 800;
    letter-spacing: .04em;
    line-height: 1;
    direction: ltr;
    color: var(--cyan);
    text-shadow: 0 0 24px rgba(56,189,248,.45);
  }
  .logo span { color: var(--text); text-shadow: none; }
  .subtitle { margin-top: 12px; color: var(--muted); font-size: 1.05rem; }

  .grid {
    width: 100%;
    max-width: 640px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .card {
    --accent: var(--cyan);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 22px 12px 20px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    background: linear-gradient(160deg, #1a2342 0%, var(--surface) 70%);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: var(--accent);
    opacity: .9;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 10px 30px -10px var(--accent);
    outline: none;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .card:active { transform: scale(.97); }

  .icon {
    width: 76px; height: 76px;
    margin-bottom: 6px;
    border-radius: 18px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .icon svg { width: 46px; height: 46px; }
  .card h2 { font-size: 1.2rem; font-weight: 800; }
  .card p { font-size: .9rem; color: var(--muted); line-height: 1.5; }
  .play {
    margin-top: 10px;
    padding: 7px 22px;
    border-radius: 999px;
    font-weight: 800;
    font-size: .95rem;
    color: #0b1020;
    background: var(--accent);
  }

  .c1 { --accent: var(--cyan); }
  .c2 { --accent: var(--amber); }
  .c3 { --accent: var(--pink); }
  .c4 { --accent: var(--green); }

  footer { margin-top: 34px; color: var(--muted); font-size: .85rem; }

  @media (max-width: 380px) {
    .grid { gap: 10px; }
    .card { padding: 18px 8px 16px; }
    .card h2 { font-size: 1.05rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">OS <span>GAMES</span></div>
  <p class="subtitle">اختر لعبتك وابدأ اللعب</p>
</header>

<main class="grid">

  <a href="game.html" class="card c1">
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="6" width="12" height="10" rx="2"/>
        <rect x="31" y="6" width="12" height="10" rx="2"/>
        <rect x="18" y="30" width="12" height="13" rx="3" fill="#38bdf8" fill-opacity=".25"/>
        <path d="M24 16v8M20 21l4 4 4-4"/>
      </svg>
    </div>
    <h2>تخطّي العوائق</h2>
    <p>تفادَ كل شيء في طريقك</p>
    <span class="play">العب</span>
  </a>

  <a href="game2.html" class="card c2">
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="6" width="11" height="7" rx="1.5" fill="#fbbf24" fill-opacity=".25"/>
        <rect x="18.5" y="6" width="11" height="7" rx="1.5" fill="#fbbf24" fill-opacity=".25"/>
        <rect x="32" y="6" width="11" height="7" rx="1.5" fill="#fbbf24" fill-opacity=".25"/>
        <circle cx="24" cy="29" r="3" fill="#fbbf24"/>
        <path d="M14 42h20"/>
      </svg>
    </div>
    <h2>تدمير الطوب</h2>
    <p>اكسر كل الطوب بالكرة</p>
    <span class="play">العب</span>
  </a>

  <a href="game3.html" class="card c3">
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 8v26a6 6 0 0 0 6 6h0a6 6 0 0 0 6-6V8"/>
        <path d="M28 8v26a6 6 0 0 0 6 6h0a6 6 0 0 0 6-6V8"/>
        <circle cx="14" cy="34" r="3" fill="#f472b6"/>
        <circle cx="14" cy="26" r="3" fill="#38bdf8" stroke="none"/>
        <circle cx="34" cy="34" r="3" fill="#fbbf24" stroke="none"/>
      </svg>
    </div>
    <h2>فرز الألوان</h2>
    <p>رتّب كل لون في أنبوبه</p>
    <span class="play">العب</span>
  </a>

  <a href="game4.html" class="card c4">
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="17" cy="29" r="10" fill="#4ade80" fill-opacity=".2"/>
        <circle cx="33" cy="17" r="7" fill="#4ade80" fill-opacity=".2"/>
        <circle cx="34" cy="35" r="5" fill="#4ade80" fill-opacity=".2"/>
        <path d="M12 25a6 6 0 0 1 4-4" />
      </svg>
    </div>
    <h2>تدمير الفقاعات</h2>
    <p>فجّر الفقاعات قبل أن تكبر</p>
    <span class="play">العب</span>
  </a>

</main>

<footer>OS GAMES</footer>

</body>
</html>
