<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الألعاب - Games Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin: 30px 0 10px; color: #38bdf8; text-align: center; }
        p.subtitle { color: #94a3b8; margin-bottom: 30px; text-align: center; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; width: 100%; max-width: 600px; }
        .game-card { background: #1e293b; border-radius: 16px; padding: 25px; text-align: center; border: 1px solid #334155; text-decoration: none; color: inherit; transition: transform 0.2s, border-color 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .game-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .game-card h2 { color: #f8fafc; margin-bottom: 10px; font-size: 1.4rem; }
        .game-card p { color: #94a3b8; font-size: 0.95rem; }
    </style>
</head>
<body>
    <h1>   OS GAMES </h2>
    <p class="subtitle">اختر اللعبة التي تريد الاستمتاع بها الآن:</p>
    
    <div class="games-grid">
        <!-- اللعبة الأولى -->
        <a href="game.html" class="game-card">
            <h2> لعبة تخطئ العوائق</h2>
        
        </a>
        
        <!-- اللعبة الثانية -->
        <a href="game2.html" class="game-card">
            <h2> لعبة تدمير الطوب</h2>
            
        </a>
          
     <!-- اللعبة الثالثة -->
  <a href="game3.html" class="game-card">
      <h2>لعبة فرز الألوان </h2>
    </a>
    
      </div>
</body>
</html>
