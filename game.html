<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wormate 3D - By Osama</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }

        #score-board { color: #fff; font-size: 28px; font-weight: 900; text-shadow: 0 0 15px #00ffcc; }
        #score-board span { color: #00ffcc; }

        #credit { align-self: flex-end; color: rgba(255,255,255,0.4); font-size: 14px; font-weight: bold; }
        #credit strong { color: #00ffcc; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.85); backdrop-filter: blur(8px);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20;
        }
        .overlay h1 { margin: 0 0 10px 0; font-size: 42px; font-weight: 900; }
        .overlay p { margin: 0 0 30px 0; color: #ccc; font-size: 18px; }
        button { padding: 12px 30px; font-size: 18px; font-weight: bold; background: #00ffcc; color: #000; border: none; border-radius: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="score-board">SIZE: <span id="score-val">10</span></div>
        <div id="credit">Programmed by <strong>Osama</strong></div>
    </div>

    <div id="win-screen" class="overlay">
        <h1 style="color:#00ffcc;">VICTORY!</h1>
        <p>You are the biggest worm.</p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <div id="lose-screen" class="overlay">
        <h1 style="color:#ff3333;">GAME OVER</h1>
        <p>You crashed or hit the wall.</p>
        <button onclick="location.reload()">TRY AGAIN</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // إعدادات المشهد
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.008); // ضباب في الأفق

        // الكاميرا
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 20);
        camera.lookAt(0, 0, 0);

        // الريندرر
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // أضواء ملونة للخلفية
        const pointLight1 = new THREE.PointLight(0x00ffcc, 50, 100);
        pointLight1.position.set(-20, 10, -20);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff00ff, 50, 100);
        pointLight2.position.set(20, 10, 20);
        scene.add(pointLight2);

        // الأرضية (شبكة)
        const gridHelper = new THREE.GridHelper(200, 100, 0x00ffcc, 0x111122);
        gridHelper.position.y = -5;
        scene.add(gridHelper);

        // --------------------
        // إعدادات اللعبة
        // --------------------
        const wormSegments = [];
        const foods = [];
        let score = 10;
        let gameOver = false;
        let gameSpeed = 0.3; // سرعة أبطأ
        let targetRotation = 0;
        let currentRotation = 0;
        let isMoving = true;

        const segmentGeo = new THREE.SphereGeometry(1, 16, 16); // جسم الدودة
        const foodGeo = new THREE.IcosahedronGeometry(0.6, 0); // شكل الأكل

        const snakeHeadMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00aa88, roughness: 0.2 });
        const snakeBodyMat = new THREE.MeshStandardMaterial({ color: 0x00ccaa, roughness: 0.4 });

        // إنشاء الدودة
        for (let i = 0; i < 15; i++) {
            let mat = i === 0 ? snakeHeadMat : snakeBodyMat;
            let seg = new THREE.Mesh(segmentGeo, mat);
            seg.castShadow = true;
            seg.position.set(0, 0, i * 1.5);
            scene.add(seg);
            wormSegments.push(seg);
        }

        // إنشاء الأكل
        function createFood() {
            let colors = [0xff3333, 0x33ff33, 0x3333ff, 0xffff33, 0xff33ff];
            let color = colors[Math.floor(Math.random() * colors.length)];
            let mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 });
            let food = new THREE.Mesh(foodGeo, mat);
            
            food.position.set(
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 100
            );
            food.castShadow = true;
            food.userData = { color: color };
            scene.add(food);
            foods.push(food);
        }

        for (let i = 0; i < 50; i++) createFood();

        // التحكم بالسحب
        let touchStart = {x: 0, y: 0};
        document.addEventListener('touchstart', (e) => {
            touchStart.x = e.changedTouches[0].screenX;
            touchStart.y = e.changedTouches[0].screenY;
        }, {passive: false});

        document.addEventListener('touchmove', (e) => {
            if (gameOver) return;
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;

            let dx = touchEndX - touchStart.x;
            let dy = touchEndY - touchStart.y;

            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                targetRotation = Math.atan2(dy, dx); // تحديد الاتجاه
            }
        }, {passive: false});

        // للكمبيوتر (الماوس)
        document.addEventListener('mousemove', (e) => {
            if (gameOver) return;
            let dx = e.clientX - window.innerWidth / 2;
            let dy = e.clientY - window.innerHeight / 2;
            if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                targetRotation = Math.atan2(dy, dx);
            }
        });

        // --------------------
        // حلقة اللعبة (Game Loop)
        // --------------------
        function animate() {
            requestAnimationFrame(animate);
            if (gameOver) return;

            // تدوير الدودة بسلاسة
            let diff = targetRotation - currentRotation;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            currentRotation += diff * 0.1; // سرعة اللف

            // تحريك الرأس
            let head = wormSegments[0];
            let dirX = Math.cos(currentRotation);
            let dirZ = Math.sin(currentRotation);
            
            head.position.x += dirX * gameSpeed;
            head.position.z += dirZ * gameSpeed;
            
            head.rotation.y = -currentRotation + Math.PI / 2;

            // تحريك باقي الجسم (يتبع الرأس)
            for (let i = 1; i < wormSegments.length; i++) {
                let prevSeg = wormSegments[i - 1];
                let seg = wormSegments[i];
                
                let dx = prevSeg.position.x - seg.position.x;
                let dz = prevSeg.position.z - seg.position.z;
                let dist = Math.sqrt(dx*dx + dz*dz);

                if (dist > 1.5) { // المسافة بين كل قطعة
                    seg.position.x += (dx / dist) * gameSpeed * 1.5;
                    seg.position.z += (dz / dist) * gameSpeed * 1.5;
                }
            }

            // فحص اصطدام الرأس بالجسم
            for (let i = 5; i < wormSegments.length; i++) {
                let dist = head.position.distanceTo(wormSegments[i].position);
                if (dist < 1.2) {
                    return endGame(false);
                }
            }

            // فحص اصطدام الرأس بالأكل
            for (let i = foods.length - 1; i >= 0; i--) {
                let food = foods[i];
                if (head.position.distanceTo(food.position) < 2) {
                    scene.remove(food);
                    foods.splice(i, 1);
                    createFood(); // توليد أكل جديد
                    
                    score += 2;
                    document.getElementById('score-val').innerText = score;
                    
                    // إضافة قطعة جديدة للدودة
                    let newSeg = new THREE.Mesh(segmentGeo, snakeBodyMat);
                    let tail = wormSegments[wormSegments.length - 1];
                    newSeg.position.copy(tail.position);
                    newSeg.castShadow = true;
                    scene.add(newSeg);
                    wormSegments.push(newSeg);

                    // تصغير الكاميرا (Zoom Out) كل ما كبرت الدودة
                    if (score % 10 === 0) {
                        camera.position.y += 2;
                        camera.position.z += 2;
                    }

                    if (score >= 100) return endGame(true);
                }
            }

            // الكاميرا تتبع الدودة
            camera.position.x += (head.position.x - camera.position.x) * 0.05;
            camera.position.z += (head.position.z - camera.position.z) * 0.05;
            camera.lookAt(head.position.x, head.position.y, head.position.z);

            // تدوير الأكل
            foods.forEach(f => {
                f.rotation.x += 0.02;
                f.rotation.y += 0.02;
            });

            renderer.render(scene, camera);
        }

        function endGame(isWin) {
            gameOver = true;
            if (isWin) document.getElementById('win-screen').style.display = 'flex';
            else document.getElementById('lose-screen').style.display = 'flex';
        }

        animate();

        // تحديث حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
