
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لعبة صائد النجوم - Star Catcher Pro</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #090d16;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 12px 20px;
            background: #111827;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            font-size: 1rem;
            font-weight: 600;
            z-index: 5;
            border-bottom: 1px solid #1f2937;
        }

        .score-box {
            display: flex;
            gap: 15px;
        }

        .highlight {
            color: #fbbf24;
        }

        .game-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 8px;
        }

        #gameCanvas {
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 2px solid #374151;
            width: 100%;
            height: 100%;
            max-height: 70vh;
        }

        .mobile-controls {
            display: flex;
            width: 100%;
            max-width: 480px;
            height: 75px;
            padding: 8px 16px;
            gap: 15px;
            z-index: 5;
        }

        .btn-control {
            flex: 1;
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            color: #f8fafc;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .btn-control:active {
            background: #fbbf24;
            color: #090d16;
            transform: scale(0.97);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 13, 22, 0.94);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 2.4rem;
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .overlay p {
            font-size: 1.25rem;
            color: #9ca3af;
        }

        .menu-btn {
            background: #fbbf24;
            color: #090d16;
            border: none;
            padding: 14px 38px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.4);
            transition: transform 0.2s;
        }

        .menu-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box">
            <div>النقاط: <span id="score" class="highlight">0</span></div>
            <div>الأرواح: <span id="lives" class="highlight">❤️❤️❤️</span></div>
        </div>
        <div>أعلى نتيجة: <span id="highScore" class="highlight">0</span></div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="mobile-controls">
        <button class="btn-control" id="btnLeft">⬅️</button>
        <button class="btn-control" id="btnRight">➡️</button>
    </div>

    <div id="overlay" class="overlay">
        <h1>🌟 Star Catcher Pro</h1>
        <p>اجمع النجوم الذهبية وتجنب القنابل الحمراء!</p>
        <button class="menu-btn" id="startBtn">ابدأ اللعبة 🚀</button>
    </div>

    <script>
        // نظام المؤثرات الصوتية التفاعلية
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'catch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');

        let score = 0;
        let lives = 3;
        let highScore = localStorage.getItem('star_catcher_hs') || 0;
        highScoreEl.innerText = highScore;

        let gameRunning = false;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();

        // إعدادات سلة اللاعب (البلورة)
        const basket = {
            width: 90,
            height: 22,
            x: 0,
            y: 0,
            speed: 9,
            dx: 0
        };

        let items = [];
        let particles = [];

        function initPositions() {
            basket.x = (canvas.width - basket.width) / 2;
            basket.y = canvas.height - 40;
        }

        // تحكم الأزرار والأجهزة الذكية
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); basket.dx = -basket.speed; });
        btnLeft.addEventListener('touchend', () => basket.dx = 0);
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); basket.dx = basket.speed; });
        btnRight.addEventListener('touchend', () => basket.dx = 0);

        btnLeft.addEventListener('mousedown', () => basket.dx = -basket.speed);
        btnLeft.addEventListener('mouseup', () => basket.dx = 0);
        btnRight.addEventListener('mousedown', () => basket.dx = basket.speed);
        btnRight.addEventListener('mouseup', () => basket.dx = 0);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right') basket.dx = basket.speed;
            else if (e.key === 'ArrowLeft' || e.key === 'Left') basket.dx = -basket.speed;
        });
        document.addEventListener('keyup', () => basket.dx = 0);

        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const relativeX = e.touches[0].clientX - rect.left;
            if (relativeX > 0 && relativeX < canvas.width) {
                basket.x = relativeX - basket.width / 2;
            }
            e.preventDefault();
        }, { passive: false });

        function spawnItem() {
            if (!gameRunning) return;
            const types = ['star', 'star', 'star', 'bomb']; // النجوم أكثر تكراراً من القنابل
            const type = types[Math.floor(Math.random() * types.length)];
            const radius = type === 'star' ? 14 : 16;
            
            items.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -20,
                radius: radius,
                speed: Math.random() * 2 + 2.5 + (score / 100), // تزداد السرعة مع التقدم
                type: type
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x, y: y,
                    dx: (Math.random() - 0.5) * 5,
                    dy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function drawBasket() {
            ctx.beginPath();
            ctx.roundRect(basket.x, basket.y, basket.width, basket.height, 10);
            ctx.fillStyle = '#fbbf24';
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0; // إعادة ضبط للآداء
            ctx.closePath();
        }

        function drawItems() {
            items.forEach((item, index) => {
                item.y += item.speed;

                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                ctx.fillStyle = item.type === 'star' ? '#facc15' : '#ef4444';
                ctx.shadowColor = item.type === 'star' ? '#facc15' : '#ef4444';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.closePath();

                // أيقونة داخل العنصر
                ctx.fillStyle = '#090d16';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(item.type === 'star' ? '⭐' : '💣', item.x, item.y + 4);

                // فحص الاصطدام بالسلة
                if (
                    item.y + item.radius >= basket.y &&
                    item.y - item.radius <= basket.y + basket.height &&
                    item.x >= basket.x &&
                    item.x <= basket.x + basket.width
                ) {
                    if (item.type === 'star') {
                        playSound('catch');
                        score += 10;
                        scoreEl.innerText = score;
                        createParticles(item.x, item.y, '#facc15');
                        if (score > highScore) {
                            highScore = score;
                            highScoreEl.innerText = highScore;
                            localStorage.setItem('star_catcher_hs', highScore);
                        }
                    } else {
                        playSound('hit');
                        lives--;
                        livesEl.innerText = '❤️'.repeat(Math.max(0, lives));
                        createParticles(item.x, item.y, '#ef4444');
                        if (lives <= 0) {
                            endGame();
                        }
                    }
                    items.splice(index, 1);
                } else if (item.y > canvas.height + 20) {
                    items.splice(index, 1);
                }
            });
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                p.x += p.dx; p.y += p.dy; p.alpha -= 0.04;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            });
        }

        function update() {
            basket.x += basket.dx;
            if (basket.x < 0) basket.x = 0;
            if (basket.x + basket.width > canvas.width) basket.x = canvas.width - basket.width;
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            update();
            drawBasket();
            drawItems();
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            score = 0;
            lives = 3;
            items = [];
            particles = [];
            scoreEl.innerText = score;
            livesEl.innerText = '❤️❤️❤️';
            overlay.classList.add('hidden');
            gameRunning = true;
            initPositions();
            gameLoop();

            // توليد النجوم كل فترة زمنية
            clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnItem, 750);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(spawnInterval);
            overlay.classList.remove('hidden');
            overlay.querySelector('h1').innerText = "💥 انتهت اللعبة!";
            overlay.querySelector('p').innerText = `مجموع نقاطك: ${score}`;
            startBtn.innerText = "العب مجدداً 🔄";
        }

        let spawnInterval;
        startBtn.addEventListener('click', startGame);

        window.addEventListener('resize', () => {
            resizeCanvas();
            initPositions();
        });

        initPositions();
    </script>
</body>
</html>
