<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gem Collector 3D - By Osama</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: Arial, sans-serif; touch-action: none; }
        
        #ui-container {
            position: absolute; top: 20px; left: 20px; color: white;
            font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.6);
            padding: 10px 20px; border-radius: 8px; pointer-events: none;
            border: 1px solid #333; z-index: 10;
        }

        #credit {
            position: absolute; bottom: 20px; right: 20px; color: #aaa;
            font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.5);
            padding: 8px 15px; border-radius: 8px; pointer-events: none;
            border: 1px solid #333; text-align: right; line-height: 1.4; z-index: 10;
        }
        
        #credit span { color: #ffcc00; font-size: 18px; }

        .overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 40px; font-weight: bold; display: none;
            text-shadow: 0 0 20px #ff0000; text-align: center;
            background: rgba(0,0,0,0.85); padding: 30px; border-radius: 15px; border: 2px solid #ff0000; z-index: 20;
            width: 80%; max-width: 400px;
        }

        #win-screen { text-shadow: 0 0 20px #ffcc00; border: 2px solid #ffcc00; }

        button {
            margin-top: 20px; padding: 10px 20px; font-size: 20px; font-weight: bold;
            background: #ffcc00; color: #000; border: none; border-radius: 8px; cursor: pointer;
        }

        #controls {
            position: absolute; bottom: 30px; left: 30px;
            display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px;
            gap: 10px; z-index: 15;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px; color: white; font-size: 28px;
            display: flex; justify-content: center; align-items: center;
            user-select: none; -webkit-user-select: none; cursor: pointer; touch-action: none;
        }
        
        .control-btn:active { background: rgba(255, 255, 255, 0.4); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        @media (min-width: 800px) { #controls { display: none; } }
    </style>
</head>
<body>

    <div id="ui-container">
        Level: 1<br>
        Gems: 0 / 5
    </div>
    
    <div id="credit">Programmed by<br><span>Osama</span></div>

    <div id="controls">
        <div class="control-btn" id="btn-up">▲</div>
        <div class="control-btn" id="btn-left">◀</div>
        <div class="control-btn" id="btn-down">▼</div>
        <div class="control-btn" id="btn-right">▶</div>
    </div>

    <!-- شاشة الخسارة -->
    <div id="lose-screen" class="overlay">
        YOU DIED!<br>
        <span style="font-size: 20px; color: #ccc;">You hit an obstacle.</span><br>
        <button onclick="location.reload()">TRY AGAIN</button>
    </div>

    <!-- شاشة الفوز -->
    <div id="win-screen" class="overlay">
        YOU WIN!<br>
        <span style="font-size: 20px; color: #ccc;">All levels completed.</span><br>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // إعدادات المشهد
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x111111, 0.02);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // الإضاءة
        scene.add(new THREE.AmbientLight(0x404040, 2)); 
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // الأرضية
        const floorGeo = new THREE.CylinderGeometry(12, 12, 0.5, 32);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.1, metalness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.receiveShadow = true;
        scene.add(floor);

        // اللاعب
        const playerGeo = new THREE.SphereGeometry(0.8, 32, 32);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.2, metalness: 0.5 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0.8, 0);
        player.castShadow = true;
        scene.add(player);

        // متغيرات اللعبة
        let currentLevel = 1;
        let score = 0;
        let isGameOver = false;
        const totalLevels = 3;
        const speed = 0.15;
        
        let gems = [];
        let obstacles = [];

        const uiElement = document.getElementById('ui-container');
        const loseScreen = document.getElementById('lose-screen');
        const winScreen = document.getElementById('win-screen');

        function updateUI() {
            uiElement.innerHTML = `Level: ${currentLevel}<br>Gems: ${score} / 5`;
        }

        // دالة توليد المرحلة
        function loadLevel(level) {
            // مسح العناصر القديمة
            gems.forEach(g => scene.remove(g));
            obstacles.forEach(o => scene.remove(o));
            gems = [];
            obstacles = [];
            score = 0;
            updateUI();

            // زيادة صعوبة العوائق حسب المرحلة
            const numGems = 5;
            const numObstacles = level * 3; // المرحلة 1 فيها 3، المرحلة 2 فيها 6، المرحلة 3 فيها 9

            // إنشاء الجواهر
            const gemGeo = new THREE.OctahedronGeometry(0.6);
            const gemMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.1, metalness: 0.9, emissive: 0x442200 });
            
            for (let i = 0; i < numGems; i++) {
                const gem = new THREE.Mesh(gemGeo, gemMat);
                gem.position.set((Math.random() - 0.5) * 18, 0.6, (Math.random() - 0.5) * 18);
                gem.castShadow = true;
                scene.add(gem);
                gems.push(gem);
            }

            // إنشاء العوائق (كرات سوداء)
            const obsGeo = new THREE.SphereGeometry(1.2, 16, 16);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8, metalness: 0.2 });
            
            for (let i = 0; i < numObstacles; i++) {
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.set((Math.random() - 0.5) * 18, 1.2, (Math.random() - 0.5) * 18);
                obs.castShadow = true;
                scene.add(obs);
                obstacles.push(obs);
            }
        }

        // التحكم
        const keys = { w: false, a: false, s: false, d: false };
        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        function setupMobileControls() {
            const bindBtn = (id, keyName) => {
                const btn = document.getElementById(id);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
                btn.addEventListener('touchcancel', (e) => { e.preventDefault(); keys[keyName] = false; });
            };
            bindBtn('btn-up', 'w'); bindBtn('btn-down', 's');
            bindBtn('btn-left', 'a'); bindBtn('btn-right', 'd');
        }
        setupMobileControls();

        // تشغيل المستوى الأول
        loadLevel(currentLevel);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) return; // إيقاف الحركة إذا خسر

            const time = clock.getElapsedTime();

            // حركة اللاعب
            if (keys.w) player.position.z -= speed;
            if (keys.s) player.position.z += speed;
            if (keys.a) player.position.x -= speed;
            if (keys.d) player.position.x += speed;

            // حدود الأرضية
            if (player.position.x > 11.5) player.position.x = 11.5;
            if (player.position.x < -11.5) player.position.x = -11.5;
            if (player.position.z > 11.5) player.position.z = 11.5;
            if (player.position.z < -11.5) player.position.z = -11.5;

            // متابعة الكاميرا
            camera.position.x += (player.position.x - camera.position.x) * 0.05;
            camera.position.z += (player.position.z + 15 - camera.position.z) * 0.05;
            camera.lookAt(player.position);

            // تدوير الجواهر وفحص التصادم
            gems.forEach((gem, index) => {
                gem.rotation.y += 0.02;
                gem.position.y = 0.6 + Math.sin(time * 3 + index) * 0.2;

                if (player.position.distanceTo(gem.position) < 1.5) {
                    scene.remove(gem);
                    gems.splice(index, 1);
                    score++;
                    updateUI();

                    // الانتقال للمرحلة التالية أو الفوز
                    if (score === 5) {
                        if (currentLevel < totalLevels) {
                            currentLevel++;
                            loadLevel(currentLevel);
                        } else {
                            isGameOver = true;
                            winScreen.style.display = 'block';
                        }
                    }
                }
            });

            // فحص تصادم العوائق
            obstacles.forEach(obs => {
                if (player.position.distanceTo(obs.position) < 1.8) { // 1.8 = مجموع أنصاف الأقطار تقريباً
                    isGameOver = true;
                    loseScreen.style.display = 'block';
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
