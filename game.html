<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لعبة نيون نينجا - Neon Slice</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #080b11;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 12px 20px;
            background: #111827;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            font-size: 1rem;
            font-weight: 600;
            z-index: 5;
            border-bottom: 1px solid #1f2937;
        }

        .score-box {
            display: flex;
            gap: 15px;
        }

        .highlight {
            color: #ec4899;
        }

        .game-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 8px;
        }

        #gameCanvas {
            background: radial-gradient(circle at center, #1f102c 0%, #080b11 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid #374151;
            width: 100%;
            height: 100%;
            max-height: 80vh;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 11, 17, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 2.4rem;
            color: #ec4899;
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
        }

        .overlay p {
            font-size: 1.2rem;
            color: #9ca3af;
        }

        .menu-btn {
            background: #ec4899;
            color: #f8fafc;
            border: none;
            padding: 14px 38px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
            transition: transform 0.2s;
        }

        .menu-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box">
            <div>النقاط: <span id="score" class="highlight">0</span></div>
            <div>الأرواح: <span id="lives" class="highlight">❤️❤️❤️</span></div>
        </div>
        <div>أعلى نتيجة: <span id="highScore" class="highlight">0</span></div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="overlay" class="overlay">
        <h1>⚔️ نيون نينجا</h1>
        <p>اسحب بإصبعك على الشاشة لتقطيع الفواكه وتجنب القنابل!</p>
        <button class="menu-btn" id="startBtn">ابدأ اللعبة 🎮</button>
    </div>

    <script>
        // نظام أصوات تفاعلية حية (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'slice') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'bomb') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.25);
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');

        let score = 0;
        let lives = 3;
        let highScore = localStorage.getItem('neon_ninja_hs') || 0;
        highScoreEl.innerText = highScore;

        let gameRunning = false;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();

        let fruits = [];
        let particles = [];
        let trail = []; // أثر الإصبع أو السيف على الشاشة

        const fruitTypes = [
            { emoji: '🍉', color: '#ef4444', radius: 28, points: 10 },
            { emoji: '🍎', color: '#dc2626', radius: 24, points: 10 },
            { emoji: '🍊', color: '#f97316', radius: 25, points: 15 },
            { emoji: '🍍', color: '#eab308', radius: 30, points: 20 },
            { emoji: '🥥', color: '#ffffff', radius: 26, points: 15 },
            { emoji: '💣', color: '#000000', radius: 25, isBomb: true }
        ];

        function spawnFruit() {
            if (!gameRunning) return;
            const template = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            
            // قذف الفاكهة من الأسفل إلى الأعلى بزاوية عشوائية
            const startX = Math.random() * (canvas.width - 100) + 50;
            const vx = (canvas.width / 2 - startX) * 0.015 + (Math.random() - 0.5) * 3;
            const vy = -(Math.random() * 4 + 11);

            fruits.push({
                x: startX,
                y: canvas.height + 30,
                vx: vx,
                vy: vy,
                gravity: 0.35,
                ...template,
                sliced: false
            });
        }

        function createSplash(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x, y: y,
                    dx: (Math.random() - 0.5) * 8,
                    dy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1
                });
            }
        }

        // تتبع حركة اللمس على شاشة الأيفون
        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            trail.push({ x, y, alpha: 1 });
            checkSlice(x, y);
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('mousemove', (e) => {
            if (e.buttons !== 1) return; // للكمبيوتر عند الضغط والسحب
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            trail.push({ x, y, alpha: 1 });
            checkSlice(x, y);
        });

        function checkSlice(x, y) {
            if (!gameRunning) return;
            fruits.forEach(f => {
                if (!f.sliced) {
                    let dist = Math.hypot(f.x - x, f.y - y);
                    if (dist < f.radius + 15) {
                        f.sliced = true;
                        createSplash(f.x, f.y, f.color);

                        if (f.isBomb) {
                            playSound('bomb');
                            lives--;
                            livesEl.innerText = '❤️❤️❤️'.substring(0, lives);
                            if (lives <= 0) endGame();
                        } else {
                            playSound('slice');
                            score += f.points;
                            scoreEl.innerText = score;
                            if (score > highScore) {
                                highScore = score;
                                highScoreEl.innerText = highScore;
                                localStorage.setItem('neon_ninja_hs', highScore);
                            }
                        }
                    }
                }
            });
        }

        function updateGame() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم أثر السيف/الإصبع
            for (let i = trail.length - 1; i >= 0; i--) {
                let t = trail[i];
                t.alpha -= 0.08;
                if (t.alpha <= 0) {
                    trail.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = t.alpha;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#ec4899';
                    ctx.shadowColor = '#ec4899';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.restore();
                }
            }

            // تحديث ورسم الفواكه
            fruits.forEach((f, index) => {
                f.x += f.vx;
                f.y += f.vy;
                f.vy += f.gravity;

                ctx.save();
                if (f.sliced) {
                    ctx.globalAlpha = 0.4;
                }
                ctx.font = `${f.radius * 1.5}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(f.emoji, f.x, f.y);
                ctx.restore();

                // إذا سقطت الفاكهة بدون تقطيع (وليست قنبلة)
                if (f.y > canvas.height + 50 && !f.sliced && !f.isBomb) {
                    lives--;
                    livesEl.innerText = '❤️'.repeat(Math.max(0, lives));
                    if (lives <= 0) endGame();
                }

                if (f.y > canvas.height + 100) {
                    fruits.splice(index, 1);
                }
            });

            // رسم قطرات العصير والشرارات
            particles.forEach((p, index) => {
                p.x += p.dx; p.y += p.dy; p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            });

            requestAnimationFrame(updateGame);
        }

        let spawnInterval;
        function startGame() {
            score = 0;
            lives = 3;
            fruits = [];
            particles = [];
            trail = [];
            scoreEl.innerText = score;
            livesEl.innerText = '❤️❤️❤️';
            overlay.classList.add('hidden');
            gameRunning = true;
            updateGame();

            clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnFruit, 900);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(spawnInterval);
            overlay.classList.remove('hidden');
            overlay.querySelector('h1').innerText = "💥 انتهت اللعبة!";
            overlay.querySelector('p').innerText = `مجموع نقاطك: ${score}`;
            startBtn.innerText = "العب مجدداً 🔄";
        }

        startBtn.addEventListener('click', startGame);

        window.addEventListener('resize', () => {
            resizeCanvas();
        });
    </script>
</body>
</html>
