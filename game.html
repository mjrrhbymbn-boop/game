<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة الكرات السحرية - Zuma Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: #0d0f18;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.2), 0 0 10px rgba(0,0,0,0.8);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #2a354d;
        }
        canvas {
            background: radial-gradient(circle at center, #1a233a 0%, #0a0d14 100%);
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 13, 20, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .screen h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0,255,204,0.5);
        }
        .screen p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #a0aec0;
        }
        .btn {
            padding: 12px 35px;
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffcc, #0099ff);
            border: none;
            color: #050b14;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: all 0.2s ease;
            pointer-events: auto;
        }
        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.6);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="ui-overlay">
        <div class="stats-bar">
            <div>النقاط: <span id="scoreDisplay">0</span></div>
            <div>المرحلة: <span id="levelDisplay">1</span></div>
            <div>المحاولات: <span id="livesDisplay">❤️❤️❤️</span></div>
        </div>
    </div>

    <!-- شاشة البداية -->
    <div id="startScreen" class="screen">
        <h1>الكرات السحرية</h1>
        <p>طابق 3 كرات أو أكثر من نفس اللون لتدميرها قبل أن تصل للنهاية!</p>
        <button class="btn" onclick="startGame()">ابدأ اللعب</button>
    </div>

    <!-- شاشة الخسارة -->
    <div id="gameOverScreen" class="screen hidden">
        <h1 style="color: #ff4757; text-shadow: 0 0 20px rgba(255,71,87,0.5);">انتهت اللعبة!</h1>
        <p>النقاط النهائية: <span id="finalScore">0</span></p>
        <button class="btn" onclick="restartGame()">محاولة جديدة</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// إعدادات اللعبة
const COLORS = [
    { name: 'red', hex: '#ff4757', glow: '#ff6b81' },
    { name: 'blue', hex: '#1e90ff', glow: '#70a1ff' },
    { name: 'green', hex: '#2ed573', glow: '#7bed9f' },
    { name: 'yellow', hex: '#ffa502', glow: '#eccc68' },
    { name: 'purple', hex: '#9b59b6', glow: '#be2edd' }
];

const BALL_RADIUS = 15;
const SHOOTER_CENTER = { x: 400, y: 300 };

let score = 0;
let level = 1;
let lives = 3;
let gameState = 'START'; // START, PLAYING, GAMEOVER

let pathPoints = [];
let pathLength = 0;
let balls = [];
let bullets = [];
let particles = [];

let currentBulletColor = null;
let nextBulletColor = null;
let mousePos = { x: 400, y: 0 };

// إنشاء مسار منحني (Bezier Curve)
function generatePath() {
    pathPoints = [];
    pathLength = 0;
    
    // نقاط المسار الحلزوني
    const controlPoints = [
        { x: -20, y: 80 },
        { x: 750, y: 80 },
        { x: 750, y: 520 },
        { x: 100, y: 520 },
        { x: 100, y: 220 },
        { x: 600, y: 220 },
        { x: 600, y: 380 },
        { x: 300, y: 380 }
    ];

    for (let i = 0; i < controlPoints.length - 1; i++) {
        const p0 = controlPoints[i];
        const p1 = controlPoints[i + 1];
        const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        const steps = Math.floor(dist / 2);

        for (let t = 0; t <= steps; t++) {
            const factor = t / steps;
            const x = p0.x + (p1.x - p0.x) * factor;
            const y = p0.y + (p1.y - p0.y) * factor;
            pathPoints.push({ x, y });
        }
    }
    pathLength = pathPoints.length;
}

// إنشاء الكرات للمستوى
function spawnLevelBalls() {
    balls = [];
    const count = 25 + level * 5;
    const activeColors = COLORS.slice(0, Math.min(3 + Math.floor(level / 2), COLORS.length));

    for (let i = 0; i < count; i++) {
        const randomColor = activeColors[Math.floor(Math.random() * activeColors.length)];
        balls.push({
            distance: -i * (BALL_RADIUS * 2.2), // مسافة بين الكرات
            color: randomColor,
            id: Math.random()
        });
    }
}

function getAvailableColors() {
    const presentColors = new Set(balls.map(b => b.color.hex));
    const activeColors = COLORS.filter(c => presentColors.has(c.hex));
    return activeColors.length > 0 ? activeColors : COLORS.slice(0, 3);
}

function prepareNextBullet() {
    const avail = getAvailableColors();
    if (!currentBulletColor) {
        currentBulletColor = avail[Math.floor(Math.random() * avail.length)];
    } else {
        currentBulletColor = nextBulletColor;
    }
    nextBulletColor = avail[Math.floor(Math.random() * avail.length)];
}

// إطلاق قذيفة
function shoot() {
    if (gameState !== 'PLAYING') return;

    const angle = Math.atan2(mousePos.y - SHOOTER_CENTER.y, mousePos.x - SHOOTER_CENTER.x);
    const speed = 14;

    bullets.push({
        x: SHOOTER_CENTER.x + Math.cos(angle) * 35,
        y: SHOOTER_CENTER.y + Math.sin(angle) * 35,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: currentBulletColor
    });

    prepareNextBullet();
}

// نظام الجسيمات للانفجارات
function createParticles(x, y, colorHex) {
    for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 4 + 2,
            color: colorHex,
            alpha: 1
        });
    }
}

// التحقق من تدمير 3 كرات أو أكثر
function checkMatches() {
    if (balls.length === 0) return;

    let matchLength = 1;
    let matchStart = 0;

    for (let i = 0; i < balls.length - 1; i++) {
        if (balls[i].color.hex === balls[i + 1].color.hex) {
            matchLength++;
        } else {
            if (matchLength >= 3) {
                destroyBalls(matchStart, matchLength);
                return;
            }
            matchLength = 1;
            matchStart = i + 1;
        }
    }

    if (matchLength >= 3) {
        destroyBalls(matchStart, matchLength);
    }
}

function destroyBalls(startIndex, count) {
    for (let i = startIndex; i < startIndex + count; i++) {
        const posIndex = Math.max(0, Math.floor(balls[i].distance));
        const pos = pathPoints[Math.min(posIndex, pathLength - 1)] || SHOOTER_CENTER;
        createParticles(pos.x, pos.y, balls[i].color.hex);
    }

    balls.splice(startIndex, count);
    score += count * 100;
    document.getElementById('scoreDisplay').innerText = score;

    // إعادة ضبط الألوان المتاحة للمدفع
    const avail = getAvailableColors();
    if (!avail.includes(currentBulletColor)) currentBulletColor = avail[0];
    if (!avail.includes(nextBulletColor)) nextBulletColor = avail[0];
}

// التحديث والفيزياء
function update() {
    if (gameState !== 'PLAYING') return;

    const baseSpeed = 0.8 + (level * 0.15);

    // تحريك كرات المسار
    for (let i = 0; i < balls.length; i++) {
        if (i === 0) {
            balls[i].distance += baseSpeed;
        } else {
            const targetDist = balls[i - 1].distance - (BALL_RADIUS * 2);
            if (balls[i].distance < targetDist) {
                balls[i].distance += baseSpeed * 2.5; // تسريع للالتحام بالصف
                if (balls[i].distance > targetDist) balls[i].distance = targetDist;
            } else {
                balls[i].distance += baseSpeed;
            }
        }
    }

    // التحقق من وصول الكرات للنهاية (الخسارة)
    if (balls.length > 0 && balls[0].distance >= pathLength - 1) {
        lives--;
        document.getElementById('livesDisplay').innerText = '❤️'.repeat(lives);
        if (lives <= 0) {
            endGame();
            return;
        } else {
            spawnLevelBalls();
        }
    }

    // التحقق من الفوز بالفصل/المرحلة
    if (balls.length === 0) {
        level++;
        document.getElementById('levelDisplay').innerText = level;
        spawnLevelBalls();
        prepareNextBullet();
    }

    // تحريك القذائف
    for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
        const b = bullets[bIndex];
        b.x += b.vx;
        b.y += b.vy;

        // خروج القذيفة من الشاشة
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(bIndex, 1);
            continue;
        }

        // الاصطدام مع كرات المسار
        for (let i = 0; i < balls.length; i++) {
            const ballPosIndex = Math.max(0, Math.floor(balls[i].distance));
            const ballPos = pathPoints[Math.min(ballPosIndex, pathLength - 1)];

            if (!ballPos) continue;

            const dist = Math.hypot(b.x - ballPos.x, b.y - ballPos.y);

            if (dist < BALL_RADIUS * 1.8) {
                // إدراج الكرة القادمة في الصف
                balls.splice(i, 0, {
                    distance: balls[i].distance - BALL_RADIUS,
                    color: b.color,
                    id: Math.random()
                });

                bullets.splice(bIndex, 1);
                checkMatches();
                break;
            }
        }
    }

    // تحديث الجسيمات
    for (let pIndex = particles.length - 1; pIndex >= 0; pIndex--) {
        const p = particles[pIndex];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(pIndex, 1);
    }
}

// الرسم والرندر
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. رسم مسار الكرات
    ctx.beginPath();
    for (let i = 0; i < pathPoints.length; i++) {
        const p = pathPoints[i];
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    }
    ctx.lineWidth = BALL_RADIUS * 2.2;
    ctx.strokeStyle = '#151c2e';
    ctx.stroke();

    ctx.lineWidth = 4;
    ctx.strokeStyle = '#2a354d';
    ctx.stroke();

    // رسم ثقب النهاية (الجمجمة/الحفرة)
    if (pathPoints.length > 0) {
        const endPt = pathPoints[pathPoints.length - 1];
        ctx.beginPath();
        ctx.arc(endPt.x, endPt.y, BALL_RADIUS * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = '#05070a';
        ctx.fill();
        ctx.strokeStyle = '#ff4757';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    // 2. رسم كرات المسار مع لمعان 3D
    for (let ball of balls) {
        if (ball.distance < 0) continue;
        const posIndex = Math.floor(ball.distance);
        if (posIndex >= pathPoints.length) continue;

        const pos = pathPoints[posIndex];

        ctx.save();
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, BALL_RADIUS, 0, Math.PI * 2);

        // التدرج اللوني إيعازاً بمظهر ثنائي أبعاد احترافي
        const grad = ctx.createRadialGradient(
            pos.x - 4, pos.y - 4, 2,
            pos.x, pos.y, BALL_RADIUS
        );
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, ball.color.glow);
        grad.addColorStop(1, ball.color.hex);

        ctx.fillStyle = grad;
        ctx.shadowColor = ball.color.glow;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
    }

    // 3. رسم القذائف المنطلقة
    for (let b of bullets) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = b.color.hex;
        ctx.shadowColor = b.color.glow;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
    }

    // 4. رسم مدفع الإطلاق والتوجيه
    ctx.save();
    ctx.translate(SHOOTER_CENTER.x, SHOOTER_CENTER.y);
    const angle = Math.atan2(mousePos.y - SHOOTER_CENTER.y, mousePos.x - SHOOTER_CENTER.x);
    ctx.rotate(angle);

    // جسم المدفع
    ctx.fillStyle = '#2ed573';
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fillStyle = '#1e272e';
    ctx.fill();
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 4;
    ctx.stroke();

    // فوهة المدفع
    ctx.fillStyle = '#485460';
    ctx.fillRect(15, -8, 25, 16);

    ctx.restore();

    // الكرة الحالية داخل المدفع
    if (currentBulletColor) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(SHOOTER_CENTER.x, SHOOTER_CENTER.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = currentBulletColor.hex;
        ctx.shadowColor = currentBulletColor.glow;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
    }

    // الكرة التالية (الاحتياطية)
    if (nextBulletColor) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(SHOOTER_CENTER.x - 45, SHOOTER_CENTER.y, BALL_RADIUS * 0.7, 0, Math.PI * 2);
        ctx.fillStyle = nextBulletColor.hex;
        ctx.globalAlpha = 0.7;
        ctx.fill();
        ctx.restore();
    }

    // 5. رسم الجسيمات المتفجرة
    for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
    }
}

// دالة الدورة الرئيسية للعبة Loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// أحداث التحكم والمدخلات
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

canvas.addEventListener('click', shoot);

function startGame() {
    score = 0;
    level = 1;
    lives = 3;
    document.getElementById('scoreDisplay').innerText = score;
    document.getElementById('levelDisplay').innerText = level;
    document.getElementById('livesDisplay').innerText = '❤️❤️❤️';
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    
    generatePath();
    spawnLevelBalls();
    prepareNextBullet();
    
    gameState = 'PLAYING';
}

function endGame() {
    gameState = 'GAMEOVER';
    document.getElementById('finalScore').innerText = score;
    document.getElementById('gameOverScreen').classList.remove('hidden');
}

function restartGame() {
    startGame();
}

// بدء حلقة الرسم والتجهيز
generatePath();
gameLoop();
</script>

</body>
</html>
