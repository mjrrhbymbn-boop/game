<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realistic Snake - By Osama</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: radial-gradient(circle at center, #2a2a35 0%, #0d0d12 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; color: white; touch-action: none;
        }
        
        #game-container { position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-radius: 12px; overflow: hidden; border: 2px solid #333; }
        canvas { background-color: #1a1a24; display: block; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 15px; box-sizing: border-box; z-index: 10;
        }

        #score-board {
            color: #fff; font-size: 28px; font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8); display: flex; justify-content: space-between; align-items: center;
        }
        #score-board span { color: #4ade80; } /* لون أخضر فاتح */

        #credit {
            align-self: flex-end; color: rgba(255,255,255,0.4); font-size: 14px;
            font-weight: bold; letter-spacing: 1px;
        }
        #credit strong { color: #4ade80; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 13, 18, 0.9); backdrop-filter: blur(5px);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20;
        }
        .overlay h1 { margin: 0 0 10px 0; font-size: 42px; font-weight: 900; }
        .overlay p { margin: 0 0 30px 0; color: #aaa; font-size: 18px; }
        
        button {
            padding: 12px 30px; font-size: 18px; font-weight: bold; 
            background: #4ade80; color: #000; border: none; border-radius: 30px; 
            cursor: pointer; transition: transform 0.2s, background 0.2s; pointer-events: auto;
        }
        button:hover { background: #22c55e; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="350" height="500"></canvas>
        
        <div id="ui-layer">
            <div id="score-board">
                SCORE: <span id="score-val">0</span>
            </div>
            <div id="credit">Programmed by <strong>Osama</strong></div>
        </div>

        <div id="win-screen" class="overlay">
            <h1 style="color:#4ade80;">VICTORY!</h1>
            <p>You reached the max score.</p>
            <button onclick="location.reload()">PLAY AGAIN</button>
        </div>

        <div id="lose-screen" class="overlay">
            <h1 style="color:#ef4444;">GAME OVER</h1>
            <p>Swipe to move. Don't hit walls or yourself.</p>
            <button onclick="location.reload()">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('score-val');
        const loseScreen = document.getElementById('lose-screen');
        const winScreen = document.getElementById('win-screen');

        // إعدادات اللعبة
        const gridSize = 25;
        const cols = canvas.width / gridSize;
        const rows = canvas.height / gridSize;
        
        let snake, food, dir, nextDir, score, gameOver, gameLoop;
        let particles = []; // تأثيرات بصرية

        // الألوان
        const snakeColorHead = '#4ade80';
        const snakeColorBody = '#22c55e';
        const foodColor = '#ef4444';

        function initGame() {
            snake = [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}];
            dir = {x: 1, y: 0};
            nextDir = {x: 1, y: 0};
            score = 0;
            gameOver = false;
            particles = [];
            scoreVal.innerText = "0";
            loseScreen.style.display = 'none';
            winScreen.style.display = 'none';
            
            generateFood();
            clearInterval(gameLoop);
            gameLoop = setInterval(update, 85); // سرعة أفضل
        }

        function generateFood() {
            while (true) {
                let newFood = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                };
                if (!snake.some(s => s.x === newFood.x && s.y === newFood.y)) {
                    food = newFood;
                    break;
                }
            }
        }

        // رسم الأفعى بشكل انسيابي
        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                const cx = segment.x * gridSize + gridSize / 2;
                const cy = segment.y * gridSize + gridSize / 2;
                const radius = gridSize / 2;

                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                
                if (i === 0) {
                    // الرأس
                    ctx.fillStyle = snakeColorHead;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = snakeColorHead;
                } else {
                    // الجسم (يتدرج باللون)
                    ctx.fillStyle = snakeColorBody;
                    ctx.shadowBlur = 0;
                }
                ctx.fill();

                // إضافة عيون للرأس
                if (i === 0) {
                    ctx.fillStyle = '#000';
                    ctx.shadowBlur = 0;
                    let eyeOffset = 5;
                    let eyeSize = 3;
                    
                    // تحديد مكان العيون حسب اتجاه الحركة
                    let ex1 = cx, ey1 = cy, ex2 = cx, ey2 = cy;
                    if (dir.x === 1) { ex1 += eyeOffset; ey1 -= eyeOffset; ex2 += eyeOffset; ey2 += eyeOffset; }
                    else if (dir.x === -1) { ex1 -= eyeOffset; ey1 -= eyeOffset; ex2 -= eyeOffset; ey2 += eyeOffset; }
                    else if (dir.y === 1) { ex1 -= eyeOffset; ey1 += eyeOffset; ex2 += eyeOffset; ey2 += eyeOffset; }
                    else if (dir.y === -1) { ex1 -= eyeOffset; ey1 -= eyeOffset; ex2 += eyeOffset; ey2 -= eyeOffset; }

                    ctx.beginPath(); ctx.arc(ex1, ey1, eyeSize, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(ex2, ey2, eyeSize, 0, Math.PI*2); ctx.fill();
                }
            }
            ctx.shadowBlur = 0; // تصفير التوهج
        }

        // رسم الأكل
        function drawFood() {
            const cx = food.x * gridSize + gridSize / 2;
            const cy = food.y * gridSize + gridSize / 2;
            
            ctx.beginPath();
            ctx.arc(cx, cy, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fillStyle = foodColor;
            ctx.shadowBlur = 20;
            ctx.shadowColor = foodColor;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // تأثيرات الجزيئات عند الأكل
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 1,
                    color: color
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function update() {
            if (gameOver) return;

            dir = nextDir;
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            // اصطدام بالجدار
            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
                return endGame(false);
            }
            // اصطدام بالنفس
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return endGame(false);
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreVal.innerText = score;
                createParticles(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, foodColor);
                generateFood();
                if (score >= 100) endGame(true);
            } else {
                snake.pop();
            }

            // الرسم
            ctx.clearRect(0, 0, canvas.width, canvas.height); // مسح الشاشة
            drawFood();
            drawSnake();
            drawParticles();
        }

        function endGame(isWin) {
            gameOver = true;
            clearInterval(gameLoop);
            if (isWin) winScreen.style.display = 'flex';
            else loseScreen.style.display = 'flex';
        }

        // --- التحكم بالسحب (Swipe) للجوال ---
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        document.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;

            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            // تحديد اتجاه السحب
            if (Math.abs(dx) > Math.abs(dy)) {
                // حركة أفقية
                if (dx > 30 && dir.x !== -1) nextDir = {x: 1, y: 0}; // يمين
                else if (dx < -30 && dir.x !== 1) nextDir = {x: -1, y: 0}; // يسار
            } else {
                // حركة عمودية
                if (dy > 30 && dir.y !== -1) nextDir = {x: 0, y: 1}; // تحت
                else if (dy < -30 && dir.y !== 1) nextDir = {x: 0, y: -1}; // فوق
            }
        }, {passive: false});

        // للكمبيوتر
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') { if (dir.y !== 1) nextDir = {x: 0, y: -1}; }
            if (e.key === 'ArrowDown' || e.key === 's') { if (dir.y !== -1) nextDir = {x: 0, y: 1}; }
            if (e.key === 'ArrowLeft' || e.key === 'a') { if (dir.x !== 1) nextDir = {x: -1, y: 0}; }
            if (e.key === 'ArrowRight' || e.key === 'd') { if (dir.x !== -1) nextDir = {x: 1, y: 0}; }
        });

        initGame();
    </script>
</body>
</html>
