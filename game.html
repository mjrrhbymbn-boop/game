<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Classic - By Osama</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background-color: #111; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; color: white; touch-action: none;
        }
        
        #game-container { position: relative; }
        canvas { background-color: #1a1a1a; border: 2px solid #333; border-radius: 8px; box-shadow: 0 0 20px rgba(0,255,0,0.1); }

        #score-board {
            position: absolute; top: -40px; left: 0; color: #00ff00;
            font-size: 24px; font-weight: bold; text-shadow: 0 0 5px #00ff00;
        }

        #credit {
            position: absolute; bottom: -40px; right: 0; color: #666; font-size: 14px;
        }
        #credit span { color: #00ff00; font-weight: bold; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 8px; z-index: 10;
        }
        .overlay h1 { margin: 0 0 10px 0; font-size: 36px; }
        .overlay p { margin: 0 0 20px 0; color: #ccc; font-size: 18px; }
        button {
            padding: 10px 25px; font-size: 18px; font-weight: bold; background: #00ff00;
            color: #000; border: none; border-radius: 5px; cursor: pointer; font-family: inherit;
        }

        /* أزرار التحكم للجوال */
        #controls {
            position: absolute; bottom: -130px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px;
            gap: 10px; z-index: 15;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid #555;
            border-radius: 10px; color: #00ff00; font-size: 24px;
            display: flex; justify-content: center; align-items: center;
            user-select: none; touch-action: none;
        }
        .btn:active { background: rgba(0, 255, 0, 0.2); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        @media (min-width: 800px) { #controls { display: none; } }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">SCORE: 0</div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
        
        <div id="credit">Programmed by <span>Osama</span></div>

        <div id="win-screen" class="overlay">
            <h1 style="color:#00ff00;">YOU WIN!</h1>
            <p>Max Score Reached.</p>
            <button onclick="location.reload()">PLAY AGAIN</button>
        </div>

        <div id="lose-screen" class="overlay">
            <h1 style="color:#ff3333;">GAME OVER</h1>
            <p>You hit the wall or yourself.</p>
            <button onclick="location.reload()">TRY AGAIN</button>
        </div>

        <div id="controls">
            <div class="btn" id="btn-up">▲</div>
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-down">▼</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score-board');
        const loseScreen = document.getElementById('lose-screen');
        const winScreen = document.getElementById('win-screen');

        const gridSize = 20; // حجم المربع
        const tileCount = canvas.width / gridSize; // عدد المربعات في الشاشة

        let snake = [];
        let food = { x: 10, y: 10 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameOver = false;
        let gameLoop;

        // إعداد اللعبة
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1; dy = 0;
            score = 0;
            gameOver = false;
            scoreElement.innerText = "SCORE: 0";
            loseScreen.style.display = 'none';
            winScreen.style.display = 'none';
            generateFood();
            
            clearInterval(gameLoop);
            gameLoop = setInterval(update, 100); // سرعة اللعبة (كل 100 مللي ثانية)
        }

        // رسم اللعبة
        function draw() {
            // خلفية اللعبة
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // الثعبان
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? '#00ff00' : '#00aa00'; // الرأس أخضر فاتح
                ctx.shadowBlur = i === 0 ? 10 : 0;
                ctx.shadowColor = '#00ff00';
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
            }
            ctx.shadowBlur = 0; // إيقاف التوهج

            // الكرة (الأكل)
            ctx.fillStyle = '#ff3333';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff3333';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2, 
                food.y * gridSize + gridSize / 2, 
                gridSize / 2 - 2, 
                0, 
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // تحديث حالة اللعبة
        function update() {
            if (gameOver) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // اصطدام بالحوائط (خسارة)
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return endGame(false);
            }

            // اصطدام بالنفس (خسارة)
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return endGame(false);
                }
            }

            snake.unshift(head);

            // أكل الكرة
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = "SCORE: " + score;
                generateFood();
                
                // شرط الفوز (مثلاً توصل 100 نقطة أو يطول الثعبان)
                if (score >= 100) {
                    endGame(true);
                }
            } else {
                snake.pop(); // إزالة الذيل إذا ما أكل
            }

            draw();
        }

        // توليد الأكل في مكان فاضي
        function generateFood() {
            let newFood;
            while (true) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                let isOnSnake = false;
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        isOnSnake = true; break;
                    }
                }
                if (!isOnSnake) break;
            }
            food = newFood;
        }

        // نهاية اللعبة
        function endGame(isWin) {
            gameOver = true;
            clearInterval(gameLoop);
            if (isWin) {
                winScreen.style.display = 'flex';
            } else {
                loseScreen.style.display = 'flex';
            }
        }

        // التحكم بالكيبورد
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') { if (dy !== 1) { dx = 0; dy = -1; } }
            if (e.key === 'ArrowDown' || e.key === 's') { if (dy !== -1) { dx = 0; dy = 1; } }
            if (e.key === 'ArrowLeft' || e.key === 'a') { if (dx !== 1) { dx = -1; dy = 0; } }
            if (e.key === 'ArrowRight' || e.key === 'd') { if (dx !== -1) { dx = 1; dy = 0; } }
        });

        // التحكم باللمس للجوال
        function bindMobileControls() {
            const bind = (id, newDx, newDy) => {
                document.getElementById(id).addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (newDx !== 0 && dx !== -newDx) { dx = newDx; dy = 0; }
                    if (newDy !== 0 && dy !== -newDy) { dx = 0; dy = newDy; }
                });
            };
            bind('btn-up', 0, -1);
            bind('btn-down', 0, 1);
            bind('btn-left', -1, 0);
            bind('btn-right', 1, 0);
        }

        // بدء اللعبة
        bindMobileControls();
        initGame();
    </script>
</body>
</html>
