
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>المتاهة العمياء</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b18;color:white;
 font-family:Arial,sans-serif;text-align:center;
 padding:20px 10px;
}
h1{color:#53f5e8;text-shadow:0 0 15px #53f5e8}
p{color:#91a0bd}
.stats{display:flex;justify-content:center;gap:10px;margin:15px}
.stat{background:#11182b;border:1px solid #263553;padding:10px;border-radius:12px;min-width:90px}
.stat small{display:block;color:#91a0bd}
.stat strong{display:block;color:#53f5e8;font-size:22px;margin-top:5px}
.board{
 position:relative;width:min(92vw,420px);
 margin:auto;background:#050817;
 border:2px solid #53f5e8;border-radius:12px;
 overflow:hidden;
}
canvas{width:100%;display:block;touch-action:none}
.overlay{
 position:absolute;inset:0;background:#050817ed;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;padding:20px;
}
.overlay.hidden{display:none}
button{
 background:#53f5e8;color:#07121c;
 border:0;border-radius:10px;padding:12px 22px;
 font-size:16px;font-weight:bold;cursor:pointer;
}
.controls{
 display:grid;grid-template-columns:60px 60px 60px;
 grid-template-rows:50px 50px;gap:8px;
 justify-content:center;margin:20px auto;
 direction:ltr;
}
.controls button{
 background:#15233a;color:#53f5e8;
 border:1px solid #53f5e8;font-size:22px;
 padding:5px;
}
.up{grid-column:2;grid-row:1}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}
.right{grid-column:3;grid-row:2}
</style>
</head>
<body>

<h1>◉ المتاهة العمياء</h1>
<p>الطريق مخفي... اكتشفه خطوة بخطوة</p>

<div class="stats">
 <div class="stat"><small>الخطوات</small><strong id="steps">0</strong></div>
 <div class="stat"><small>المرحلة</small><strong id="level">1</strong></div>
 <div class="stat"><small>أفضل نتيجة</small><strong id="best">0</strong></div>
</div>

<div class="board">
 <canvas id="game" width="420" height="420"></canvas>
 <div class="overlay" id="overlay">
  <h2 id="title">هل تثق بذاكرتك؟</h2>
  <p id="message">اكتشف طريقك إلى المخرج الأخضر.<br>انتبه، الرؤية محدودة!</p>
  <button id="start">ابدأ اللعب</button>
 </div>
</div>

<div class="controls">
 <button class="up" data-dir="0">▲</button>
 <button class="left" data-dir="3">◀</button>
 <button class="down" data-dir="2">▼</button>
 <button class="right" data-dir="1">▶</button>
</div>

<button onclick="hint()">💡 تلميح</button>
<button onclick="restart()" style="background:#263653;color:white">إعادة المرحلة</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const N=15,CELL=28;
const dirs=[
 {x:0,y:-1},{x:1,y:0},
 {x:0,y:1},{x:-1,y:0}
];

let maze,player,goal,steps=0,level=1;
let running=false;
let best=Number(localStorage.getItem("mazeBest")||0);
document.getElementById("best").textContent=best;

function generateMaze(){
 maze=Array.from({length:N},()=>Array.from(
 {length:N},()=>({walls:[1,1,1,1]})));
 let visited=Array.from({length:N},()=>Array(N).fill(false));
 let stack=[{x:0,y:0}];
 visited[0][0]=true;

 while(stack.length){
  let c=stack[stack.length-1],options=[];
  dirs.forEach((d,i)=>{
   let x=c.x+d.x,y=c.y+d.y;
   if(x>=0&&x<N&&y>=0&&y<N&&!visited[y][x])
    options.push({x,y,i});
  });
  if(!options.length){stack.pop();continue}
  let o=options[Math.floor(Math.random()*options.length)];
  maze[c.y][c.x].walls[o.i]=0;
  maze[o.y][o.x].walls[(o.i+2)%4]=0;
  visited[o.y][o.x]=true;
  stack.push({x:o.x,y:o.y});
 }
 player={x:0,y:0};
 goal={x:N-1,y:N-1};
 steps=0;
 draw();
 update();
}

function update(){
 document.getElementById("steps").textContent=steps;
 document.getElementById("level").textContent=level;
 document.getElementById("best").textContent=best;
}

function draw(){
 ctx.fillStyle="#070d1d";
 ctx.fillRect(0,0,420,420);

 for(let y=0;y<N;y++){
  for(let x=0;x<N;x++){
   let distance=Math.max(
    Math.abs(x-player.x),
    Math.abs(y-player.y)
   );
   let visible=distance<=2;
   let px=x*CELL,py=y*CELL;

   if(visible){
    ctx.fillStyle="#10283a";
    ctx.fillRect(px+1,py+1,26,26);
    ctx.strokeStyle="#53a8b7";
    ctx.lineWidth=2;
    let w=maze[y][x].walls;
    if(w[0])line(px,py,px+CELL,py);
    if(w[1])line(px+CELL,py,px+CELL,py+CELL);
    if(w[2])line(px,py+CELL,px+CELL,py+CELL);
    if(w[3])line(px,py,px,py+CELL);
   }else{
    ctx.fillStyle="#090f20";
    ctx.fillRect(px+1,py+1,26,26);
   }
  }
 }

 if(Math.max(
  Math.abs(goal.x-player.x),
  Math.abs(goal.y-player.y)
 )<=2){
  ctx.fillStyle="#5dff9a";
  ctx.shadowColor="#5dff9a";
  ctx.shadowBlur=18;
  ctx.beginPath();
  ctx.arc(goal.x*CELL+14,goal.y*CELL+14,7,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
 }

 ctx.fillStyle="#53f5e8";
 ctx.shadowColor="#53f5e8";
 ctx.shadowBlur=18;
 ctx.beginPath();
 ctx.arc(player.x*CELL+14,player.y*CELL+14,7,0,Math.PI*2);
 ctx.fill();
 ctx.shadowBlur=0;
}

function line(x1,y1,x2,y2){
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.lineTo(x2,y2);
 ctx.stroke();
}

function move(d){
 if(!running)return;
 let cell=maze[player.y][player.x];
 if(cell.walls[d])return;

 player.x+=dirs[d].x;
 player.y+=dirs[d].y;
 steps++;
 update();
 draw();

 if(player.x===goal.x&&player.y===goal.y){
  running=false;
  if(!best||steps<best){
   best=steps;
   localStorage.setItem("mazeBest",best);
  }
  update();
  document.getElementById("title").textContent=
   level===5?"🏆 فزت بجميع المراحل!":"أحسنت! وجدت المخرج";
  document.getElementById("message").textContent=
   "أنهيت المرحلة في "+steps+" خطوة";
  document.getElementById("start").textContent=
   level===5?"العب من جديد":"المرحلة التالية";
  document.getElementById("overlay").classList.remove("hidden");
 }
}

function start(){
 if(level>5)level=1;
 generateMaze();
 running=true;
 document.getElementById("overlay").classList.add("hidden");
}

function restart(){
 generateMaze();
 running=true;
 document.getElementById("overlay").classList.add("hidden");
}

document.getElementById("start").onclick=()=>{
 if(!running&&player&&player.x===goal.x&&player.y===goal.y)
  level=level>=5?1:level+1;
 start();
};

document.querySelectorAll("[data-dir]").forEach(b=>{
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  move(Number(b.dataset.dir));
 });
});

document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,
  w:0,d:1,s:2,a:3
 };
 if(keys[e.key]!==undefined){
  e.preventDefault();
  move(keys[e.key]);
 }
});

function hint(){
 if(!running)return;
 let q=[{x:player.x,y:player.y,first:-1}];
 let seen=Array.from({length:N},()=>Array(N).fill(false));
 seen[player.y][player.x]=true;
 let answer=-1;

 for(let i=0;i<q.length;i++){
  let c=q[i];
  if(c.x===goal.x&&c.y===goal.y){
   answer=c.first;break;
  }
  dirs.forEach((d,k)=>{
   let x=c.x+d.x,y=c.y+d.y;
   if(x>=0&&x<N&&y>=0&&y<N&&
   !seen[y][x]&&!maze[c.y][c.x].walls[k]){
    seen[y][x]=true;
    q.push({x,y,first:c.first<0?k:c.first});
   }
  });
 }
 if(answer>=0){
  alert("التلميح: تحرك "+["أعلى","يمين","أسفل","يسار"][answer]);
  steps+=5;
  update();
 }
}

generateMaze();
</script>
</body>
</html>
