<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لعبة تدمير الطوب - Ultimate Edition</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 10px 16px;
            background: #1e293b;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 5;
        }

        .score-box {
            display: flex;
            gap: 10px;
        }

        .highlight {
            color: #38bdf8;
        }

        .game-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 5px;
        }

        #gameCanvas {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
            width: 100%;
            height: 100%;
            max-height: 68vh;
        }

        .mobile-controls {
            display: flex;
            width: 100%;
            max-width: 480px;
            height: 65px;
            padding: 5px 16px;
            gap: 15px;
            z-index: 5;
        }

        .btn-control {
            flex: 1;
            background: rgba(51, 65, 85, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #f8fafc;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .btn-control:active {
            background: #38bdf8;
            color: #0f172a;
            transform: scale(0.98);
        }

        /* واجهة القوائم (البداية واختيار الصعوبة والنهاية) */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 2.2rem;
            color: #38bdf8;
        }

        .overlay p {
            font-size: 1.2rem;
            color: #94a3b8;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 260px;
        }

        .menu-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-btn.primary {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .menu-btn:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box">
            <div>نقاط: <span id="score" class="highlight">0</span></div>
            <div>ارواح: <span id="lives" class="highlight">❤️❤️❤️</span></div>
        </div>
        <div>أعلى: <span id="highScore" class="highlight">0</span></div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="mobile-controls">
        <button class="btn-control" id="btnLeft">⬅️</button>
        <button class="btn-control" id="btnRight">➡️</button>
    </div>

    <!-- شاشة البداية واختيار الصعوبة -->
    <div id="menuOverlay" class="overlay">
        <h1>🧱 Brick Breaker Pro</h1>
        <p>اختر مستوى الصعوبة للبدء:</p>
        <div class="btn-group">
            <button class="menu-btn" onclick="startGame('easy')">🟢 سهل (مضرب عريض)</button>
            <button class="menu-btn primary" onclick="startGame('medium')">🟡 متوسط (توازن)</button>
            <button class="menu-btn" onclick="startGame('hard')">🔴 صعب (سرعة وتحدي)</button>
        </div>
    </div>

    <!-- شاشة الخسارة / الفوز -->
    <div id="endOverlay" class="overlay hidden">
        <h1 id="endTitle">انتهت اللعبة!</h1>
        <p id="finalScore">مجموع نقاطك: 0</p>
        <button class="menu-btn primary" onclick="returnToMenu()">القائمة الرئيسية 🏠</button>
    </div>

    <script>
        // نظام أصوات محسن (Soft Audio Frequencies)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.06);
                osc.start(now); osc.stop(now + 0.06);
            } else if (type === 'brick') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                gainNode.gain.setValueAtTime(0.12, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'powerup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.12);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'danger') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.15);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const highScoreEl = document.getElementById('highScore');
        const menuOverlay = document.getElementById('menuOverlay');
        const endOverlay = document.getElementById('endOverlay');
        const endTitle = document.getElementById('endTitle');
        const finalScoreEl = document.getElementById('finalScore');

        let score = 0;
        let lives = 3;
        let difficulty = 'medium';
        let highScore = localStorage.getItem('brick_breaker_ultimate_hs') || 0;
        highScoreEl.innerText = highScore;

        let gameStarted = false;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();

        const paddle = { width: 90, height: 14, x: 0, y: 0, speed: 8, dx: 0 };
        let balls = [];
        let powerUps = [];
        let particles = [];

        const brickRowCount = 5;
        const brickColumnCount = 5;
        let brickWidth = 0;
        let brickHeight = 18;
        let brickPadding = 8;
        let brickOffsetTop = 30;
        let brickOffsetLeft = 10;
        const brickColors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8'];
        let bricks = [];

        function initSettings(diff) {
            difficulty = diff;
            if (diff === 'easy') {
                paddle.width = 110;
                ballSpeed = 3.5;
                lives = 4;
            } else if (diff === 'medium') {
                paddle.width = 90;
                ballSpeed = 4.5;
                lives = 3;
            } else if (diff === 'hard') {
                paddle.width = 75;
                ballSpeed = 6;
                lives = 2;
            }
            updateLivesUI();
        }

        function updateLivesUI() {
            livesEl.innerText = '❤️'.repeat(Math.max(0, lives));
        }

        function resetBall() {
            balls = [{
                x: canvas.width / 2,
                y: paddle.y - 15,
                radius: 7,
                dx: (Math.random() > 0.5 ? 1 : -1) * 3,
                dy: -ballSpeed
            }];
        }

        function initPositions() {
            paddle.x = (canvas.width - paddle.width) / 2;
            paddle.y = canvas.height - 35;
            resetBall();
            brickWidth = (canvas.width - (brickOffsetLeft * 2) - (brickPadding * (brickColumnCount - 1))) / brickColumnCount;
        }

        function createBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[r] };
                }
            }
        }

        // تحكم الأزرار
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); paddle.dx = -paddle.speed; });
        btnLeft.addEventListener('touchend', () => paddle.dx = 0);
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); paddle.dx = paddle.speed; });
        btnRight.addEventListener('touchend', () => paddle.dx = 0);

        btnLeft.addEventListener('mousedown', () => paddle.dx = -paddle.speed);
        btnLeft.addEventListener('mouseup', () => paddle.dx = 0);
        btnRight.addEventListener('mousedown', () => paddle.dx = paddle.speed);
        btnRight.addEventListener('mouseup', () => paddle.dx = 0);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right') paddle.dx = paddle.speed;
            else if (e.key === 'ArrowLeft' || e.key === 'Left') paddle.dx = -paddle.speed;
        });
        document.addEventListener('keyup', () => paddle.dx = 0);

        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const relativeX = e.touches[0].clientX - rect.left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
            }
            e.preventDefault();
        }, { passive: false });

        function createParticles(x, y, color) {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: x + brickWidth / 2, y: y + brickHeight / 2,
                    dx: (Math.random() - 0.5) * 4, dy: (Math.random() - 0.5) * 4,
                    radius: Math.random() * 3 + 1, color: color, alpha: 1
                });
            }
        }

        function spawnPowerUp(x, y) {
            if (Math.random() < 0.3) {
                const types = ['multiball', 'expand', 'bonus', 'danger'];
                const type = types[Math.floor(Math.random() * types.length)];
                powerUps.push({ x: x + brickWidth / 2, y: y, type: type, dy: 2.2 });
            }
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 7);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();
            ctx.closePath();
        }

        function drawBalls() {
            balls.forEach(ball => {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f8fafc';
                ctx.fill();
                ctx.closePath();
            });
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        b.x = brickX; b.y = brickY;
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
                        ctx.fillStyle = b.color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function drawPowerUps() {
            powerUps.forEach((p, index) => {
                p.y += p.dy;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
                ctx.fillStyle = p.type === 'multiball' ? '#10b981' : p.type === 'expand' ? '#3b82f6' : p.type === 'bonus' ? '#f59e0b' : '#ef4444';
                ctx.fill();
                ctx.closePath();

                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                let icon = p.type === 'multiball' ? '⚽' : p.type === 'expand' ? '↔️' : p.type === 'bonus' ? '$' : '❌';
                ctx.fillText(icon, p.x, p.y + 3);

                if (p.y + 10 >= paddle.y && p.x >= paddle.x && p.x <= paddle.x + paddle.width) {
                    if (p.type === 'multiball') {
                        playSound('powerup');
                        let newBalls = [];
                        balls.forEach(b => {
                            newBalls.push(b);
                            newBalls.push({ x: b.x, y: b.y, radius: 7, dx: -b.dx, dy: b.dy });
                        });
                        balls = newBalls;
                    } else if (p.type === 'expand') {
                        playSound('powerup');
                        paddle.width = Math.min(paddle.width + 30, 140);
                    } else if (p.type === 'bonus') {
                        playSound('powerup');
                        score += 50;
                        scoreEl.innerText = score;
                    } else if (p.type === 'danger') {
                        playSound('danger');
                        lives--;
                        updateLivesUI();
                        if (lives <= 0) endGame();
                    }
                    powerUps.splice(index, 1);
                } else if (p.y > canvas.height) {
                    powerUps.splice(index, 1);
                }
            });
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                p.x += p.dx; p.y += p.dy; p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(index, 1);
                else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            });
        }

        function collisionDetection() {
            let activeBricks = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        activeBricks++;
                        balls.forEach(ball => {
                            if (ball.x > b.x && ball.x < b.x + brickWidth && ball.y > b.y && ball.y < b.y + brickHeight) {
                                ball.dy = -ball.dy;
                                b.status = 0;
                                score += 10;
                                scoreEl.innerText = score;
                                playSound('brick');
                                createParticles(b.x, b.y, b.color);
                                spawnPowerUp(b.x, b.y);

                                if (score > highScore) {
                                    highScore = score;
                                    highScoreEl.innerText = highScore;
                                    localStorage.setItem('brick_breaker_ultimate_hs', highScore);
                                }
                            }
                        });
                    }
                }
            }

            if (activeBricks === 0) {
                createBricks();
                resetBall();
            }
        }

        function move() {
            paddle.x += paddle.dx;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

            for (let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                ball.x += ball.dx;
                ball.y += ball.dy;

                if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                    ball.dx = -ball.dx;
                    playSound('hit');
                }
                if (ball.y - ball.radius < 0) {
                    ball.dy = -ball.dy;
                    playSound('hit');
                }

                if (ball.y + ball.radius >= paddle.y && ball.x >= paddle.x && ball.x <= paddle.x + paddle.width) {
                    ball.dy = -Math.abs(ball.dy);
                    let collidePoint = ball.x - (paddle.x + paddle.width / 2);
                    ball.dx = collidePoint * 0.15;
                    playSound('hit');
                }

                if (ball.y + ball.radius > canvas.height) {
                    balls.splice(i, 1);
                }
            }

            if (balls.length === 0) {
                lives--;
                updateLivesUI();
                if (lives <= 0) {
                    endGame();
                } else {
                    resetBall();
                }
            }
        }

        function startGame(diff) {
            initSettings(diff);
            score = 0;
            scoreEl.innerText = score;
            powerUps = [];
            particles = [];
            menuOverlay.classList.add('hidden');
            endOverlay.classList.add('hidden');
            gameStarted = true;
            initPositions();
            createBricks();
            draw();
        }

        function endGame() {
            gameStarted = false;
            endOverlay.classList.remove('hidden');
            endTitle.innerText = "💥 انتهت اللعبة!";
            finalScoreEl.innerText = `مجموع نقاطك: ${score}`;
        }

        function returnToMenu() {
            endOverlay.classList.add('hidden');
            menuOverlay.classList.remove('hidden');
        }

        let ballSpeed = 4.5;

        function draw() {
            if (!gameStarted) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBricks();
            drawBalls();
            drawPaddle();
            drawPowerUps();
            drawParticles();

            collisionDetection();
            move();

            requestAnimationFrame(draw);
        }
    </script>
</body>
</html>
