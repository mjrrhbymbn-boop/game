<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لعبة تدمير الطوب - Mobile Edition</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh; /* لدعم أبعاد الأيفون بدقة */
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 10px 16px;
            background: #1e293b;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            font-size: 0.95rem;
            font-weight: 600;
            z-index: 5;
        }

        .score-box {
            display: flex;
            gap: 15px;
        }

        .highlight {
            color: #38bdf8;
        }

        .game-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 5px;
        }

        #gameCanvas {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
            width: 100%;
            height: 100%;
            max-height: 70vh;
        }

        /* أزرار التحكم للأيفون والجوالات */
        .mobile-controls {
            display: flex;
            width: 100%;
            max-width: 480px;
            height: 70px;
            padding: 8px 16px;
            gap: 15px;
            z-index: 5;
        }

        .btn-control {
            flex: 1;
            background: rgba(51, 65, 85, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #f8fafc;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            active-background: #38bdf8;
        }

        .btn-control:active {
            background: #38bdf8;
            color: #0f172a;
            transform: scale(0.98);
        }

        /* شاشات الفوز والخسارة */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 2.2rem;
            color: #38bdf8;
        }

        .overlay p {
            font-size: 1.3rem;
        }

        .overlay button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box">
            <div>النقاط: <span id="score" class="highlight">0</span></div>
            <div>المستوى: <span id="level" class="highlight">1</span></div>
        </div>
        <div>أعلى نتيجة: <span id="highScore" class="highlight">0</span></div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- أزرار تحكم مريحة لعملية اللعب بالجوال -->
    <div class="mobile-controls">
        <button class="btn-control" id="btnLeft">⬅️</button>
        <button class="btn-control" id="btnRight">➡️</button>
    </div>

    <!-- واجهة الخسارة / الفوز -->
    <div id="overlay" class="overlay hidden">
        <h1 id="overlayTitle">انتهت اللعبة!</h1>
        <p id="finalScore">نقاطك: 0</p>
        <button id="restartBtn">العب مجدداً 🔄</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        let score = 0;
        let level = 1;
        let highScore = localStorage.getItem('brick_breaker_highscore') || 0;
        highScoreEl.innerText = highScore;

        let gameOver = false;

        // ضبط أبعاد Canvas بدقة الشاشة
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();

        // إعدادات المضرب
        const paddle = {
            width: 90,
            height: 14,
            x: 0,
            y: 0,
            speed: 8,
            dx: 0
        };

        // إعدادات الكرة
        const ball = {
            x: 0,
            y: 0,
            radius: 7,
            speed: 5,
            dx: 3,
            dy: -3
        };

        // الهدايا والجزيئات
        let powerUps = [];
        let particles = [];

        // إعدادات الطوب
        const brickRowCount = 5;
        const brickColumnCount = 5;
        let brickWidth = 0;
        let brickHeight = 18;
        let brickPadding = 8;
        let brickOffsetTop = 30;
        let brickOffsetLeft = 10;

        const brickColors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8'];
        let bricks = [];

        function initPositions() {
            paddle.x = (canvas.width - paddle.width) / 2;
            paddle.y = canvas.height - 35;
            
            ball.x = canvas.width / 2;
            ball.y = paddle.y - 15;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * (3 + level * 0.5);
            ball.dy = -(4 + level * 0.5);

            brickWidth = (canvas.width - (brickOffsetLeft * 2) - (brickPadding * (brickColumnCount - 1))) / brickColumnCount;
        }

        function createBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { 
                        x: 0, 
                        y: 0, 
                        status: 1, 
                        color: brickColors[(r + level - 1) % brickColors.length] 
                    };
                }
            }
        }

        // أزرار التحكم
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); paddle.dx = -paddle.speed; });
        btnLeft.addEventListener('touchend', () => paddle.dx = 0);
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); paddle.dx = paddle.speed; });
        btnRight.addEventListener('touchend', () => paddle.dx = 0);

        btnLeft.addEventListener('mousedown', () => paddle.dx = -paddle.speed);
        btnLeft.addEventListener('mouseup', () => paddle.dx = 0);
        btnRight.addEventListener('mousedown', () => paddle.dx = paddle.speed);
        btnRight.addEventListener('mouseup', () => paddle.dx = 0);

        // تحكم الكيبورد واللمس المباشر
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right') paddle.dx = paddle.speed;
            else if (e.key === 'ArrowLeft' || e.key === 'Left') paddle.dx = -paddle.speed;
        });

        document.addEventListener('keyup', () => paddle.dx = 0);

        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const relativeX = e.touches[0].clientX - rect.left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
            }
            e.preventDefault();
        }, { passive: false });

        // إنشاء جزيئات انفجار عند ضرب الطوب
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x + brickWidth / 2,
                    y: y + brickHeight / 2,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        // إمكانية إسقاط هدية
        function spawnPowerUp(x, y) {
            if (Math.random() < 0.25) { // نسبة 25% لسقوط هدية
                const types = ['expand', 'slow', 'bonus'];
                const type = types[Math.floor(Math.random() * types.length)];
                powerUps.push({ x: x + brickWidth / 2, y: y, type: type, dy: 2 });
            }
        }

        // رسم العناوين والعناصر
        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 7);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();
            ctx.closePath();
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#f8fafc';
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        b.x = brickX;
                        b.y = brickY;

                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
                        ctx.fillStyle = b.color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function drawPowerUps() {
            powerUps.forEach((p, index) => {
                p.y += p.dy;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = p.type === 'expand' ? '#3b82f6' : p.type === 'slow' ? '#10b981' : '#f59e0b';
                ctx.fill();
                ctx.closePath();

                // التلتقاط بالمضرب
                if (p.y + 8 >= paddle.y && p.x >= paddle.x && p.x <= paddle.x + paddle.width) {
                    if (p.type === 'expand') paddle.width = 120;
                    if (p.type === 'slow') ball.dy *= 0.8;
                    if (p.type === 'bonus') score += 50;
                    powerUps.splice(index, 1);
                }
            });
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= 0.02;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            });
        }

        function collisionDetection() {
            let activeBricks = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        activeBricks++;
                        if (
                            ball.x > b.x &&
                            ball.x < b.x + brickWidth &&
                            ball.y > b.y &&
                            ball.y < b.y + brickHeight
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            scoreEl.innerText = score;

                            createParticles(b.x, b.y, b.color);
                            spawnPowerUp(b.x, b.y);

                            if (score > highScore) {
                                highScore = score;
                                highScoreEl.innerText = highScore;
                                localStorage.setItem('brick_breaker_highscore', highScore);
                            }
                        }
                    }
                }
            }

            // الانقال للمستوى التالي
            if (activeBricks === 0) {
                level++;
                levelEl.innerText = level;
                initPositions();
                createBricks();
            }
        }

        function move() {
            paddle.x += paddle.dx;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

            ball.x += ball.dx;
            ball.y += ball.dy;

            // ضبط التصادم مع الأطراف الدقيقة لمنع الخروج خارج الشاشة
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }

            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }

            // التصادم مع المضرب
            if (
                ball.y + ball.radius >= paddle.y &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width
            ) {
                ball.dy = -Math.abs(ball.dy);
                let collidePoint = ball.x - (paddle.x + paddle.width / 2);
                ball.dx = collidePoint * 0.15;
            }

            // الخسارة
            if (ball.y + ball.radius > canvas.height) {
                endGame();
            }
        }

        function endGame() {
            gameOver = true;
            overlay.classList.remove('hidden');
            overlayTitle.innerText = "💥 انتهت اللعبة!";
            overlayTitle.style.color = "#f43f5e";
            finalScoreEl.innerText = `النقاط: ${score} | المستوى: ${level}`;
        }

        function resetGame() {
            score = 0;
            level = 1;
            scoreEl.innerText = score;
            levelEl.innerText = level;
            gameOver = false;
            paddle.width = 90;
            powerUps = [];
            particles = [];
            initPositions();
            createBricks();
            overlay.classList.add('hidden');
            draw();
        }

        function draw() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBricks();
            drawBall();
            drawPaddle();
            drawPowerUps();
            drawParticles();

            collisionDetection();
            move();

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initPositions();
        });

        restartBtn.addEventListener('click', resetGame);

        // تشغيل اللعبة
        initPositions();
        createBricks();
        draw();
    </script>
</body>
</html>
