<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة تدمير الطوب - Brick Breaker</title>
    
    <!-- 1. كود التنسيق والتصميم (CSS) -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            padding: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        #gameCanvas {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
            touch-action: none; /* لمنع التمرير أثناء اللعب باللمس على الجوال */
        }

        .controls-hint {
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }

        /* واجهة الخسارة والفوز */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 2.5rem;
            color: #38bdf8;
        }

        .overlay p {
            font-size: 1.5rem;
        }

        .overlay button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .overlay button:hover {
            transform: scale(1.05);
            background: #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="score-board">النقاط: <span id="score">0</span></div>
            <div class="high-score">أعلى نتيجة: <span id="highScore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="480" height="600"></canvas>

        <div class="controls-hint">
            <p>💡 استعمل الأسهم ⬅️ ➡️ أو اسحب بإصبعك على الشاشة للتحريك</p>
        </div>
    </div>

    <!-- واجهة الخسارة / الفوز -->
    <div id="overlay" class="overlay hidden">
        <h1 id="overlayTitle">انتهت اللعبة!</h1>
        <p id="finalScore">نقاطك: 0</p>
        <button id="restartBtn">العب مجدداً 🔄</button>
    </div>

    <!-- 2. كود البرمجة والمنطق (JavaScript) -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        let score = 0;
        let highScore = localStorage.getItem('brick_breaker_highscore') || 0;
        highScoreEl.innerText = highScore;

        let gameOver = false;
        let gameWon = false;

        // إعدادات المضرب
        const paddle = {
            width: 100,
            height: 15,
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            speed: 7,
            dx: 0
        };

        // إعدادات الكرة
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 45,
            radius: 8,
            speed: 5,
            dx: 4,
            dy: -4
        };

        // إعدادات الطوب
        const brickRowCount = 5;
        const brickColumnCount = 6;
        const brickPadding = 10;
        const brickOffsetTop = 40;
        const brickOffsetLeft = 20;
        const brickWidth = (canvas.width - (brickOffsetLeft * 2) - (brickPadding * (brickColumnCount - 1))) / brickColumnCount;
        const brickHeight = 20;

        const brickColors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8'];

        let bricks = [];

        function createBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[r] };
                }
            }
        }

        // تحكم الكيبورد
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right') paddle.dx = paddle.speed;
            else if (e.key === 'ArrowLeft' || e.key === 'Left') paddle.dx = -paddle.speed;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'ArrowLeft' || e.key === 'Left') {
                paddle.dx = 0;
            }
        });

        // تحكم الماوس واللمس للجوال
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const relativeX = e.clientX - rect.left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const relativeX = e.touches[0].clientX - rect.left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
            }
            e.preventDefault();
        }, { passive: false });

        // رسم المضرب
        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();
            ctx.closePath();
        }

        // رسم الكرة
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#f8fafc';
            ctx.fill();
            ctx.closePath();
        }

        // رسم الطوب
        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;

                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        // فحص تصادم الكرة بالطوب
        function collisionDetection() {
            let activeBricks = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        activeBricks++;
                        if (
                            ball.x > b.x &&
                            ball.x < b.x + brickWidth &&
                            ball.y > b.y &&
                            ball.y < b.y + brickHeight
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            scoreEl.innerText = score;

                            if (score > highScore) {
                                highScore = score;
                                highScoreEl.innerText = highScore;
                                localStorage.setItem('brick_breaker_highscore', highScore);
                            }
                        }
                    }
                }
            }

            if (activeBricks === 0 && !gameWon) {
                gameWon = true;
                endGame(true);
            }
        }

        // تحريك الحركة
        function move() {
            paddle.x += paddle.dx;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

            ball.x += ball.dx;
            ball.y += ball.dy;

            // التصادم مع الأطراف
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }

            // التصادم مع السقف
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }

            // التصادم مع المضرب
            if (
                ball.y + ball.radius > paddle.y &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width
            ) {
                ball.dy = -ball.speed;
                let collidePoint = ball.x - (paddle.x + paddle.width / 2);
                ball.dx = collidePoint * 0.15;
            }

            // الخسارة عند سقوط الكرة
            if (ball.y + ball.radius > canvas.height) {
                endGame(false);
            }
        }

        // إنهاء اللعبة
        function endGame(isWin) {
            gameOver = true;
            overlay.classList.remove('hidden');
            if (isWin) {
                overlayTitle.innerText = "🎉 مبروك! فزت باللعبة";
                overlayTitle.style.color = "#4ade80";
            } else {
                overlayTitle.innerText = "💥 انتهت اللعبة!";
                overlayTitle.style.color = "#f43f5e";
            }
            finalScoreEl.innerText = `مجموع نقاطك: ${score}`;
        }

        // إعادة التشغيل
        function resetGame() {
            score = 0;
            scoreEl.innerText = score;
            gameOver = false;
            gameWon = false;
            paddle.x = canvas.width / 2 - 50;
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 45;
            ball.dx = 4;
            ball.dy = -4;
            createBricks();
            overlay.classList.add('hidden');
            draw();
        }

        // الحلقة الرئيسية (Game Loop)
        function draw() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();
            move();

            requestAnimationFrame(draw);
        }

        restartBtn.addEventListener('click', resetGame);

        // بدء اللعبة
        createBricks();
        draw();
    </script>
</body>
</html>
